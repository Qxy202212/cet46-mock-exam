shell:
  type: none
  title: 2026年英语四级考试真题一

regions:
  - id: exam_topbar
    type: page_header
    label: 考场顶栏
    layout:
      direction: row
      gap: 12
      padding: 12
    components:
      - kind: text
        label: 试卷名
        sample_value: 2026年英语四级考试真题一
      - kind: text
        label: 剩余时间
        sample_value: 477分36秒
      - kind: button
        label: 退出考场
        variant: danger

  - id: summary_strip
    type: summary_strip
    label: 模式条
    layout:
      direction: row
      gap: 12
      padding: 16
    components:
      - kind: button
        label: 单题模式
        variant: primary
      - kind: button
        label: 整卷模式
        variant: secondary

  - id: tabs
    type: tabs
    label: 答题卡分组
    layout:
      direction: column
      gap: 8
      padding: 16
    components:
      - kind: tab
        label: 仔细阅读 47 当前

  - id: parent_panel
    type: form_section
    label: 篇章
    layout:
      direction: column
      gap: 8
      padding: 24
    components:
      - kind: text
        label: Passage One
        sample_value: Eleven Madison Park is becoming a vegan restaurant.

  - id: question_block
    type: form_section
    label: 子题
    layout:
      direction: column
      gap: 8
      padding: 16
    components:
      - kind: text
        label: 题干
        sample_value: 47. What is the chef's attitude toward plant-based fine dining?
      - kind: list_item
        label: A
        sample_value: It is only suitable for casual restaurants.

  - id: nav_bar
    type: action_bar
    label: 题间导航
    layout:
      direction: row
      gap: 8
      padding: 16
    constraints:
      primary_actions_max: 1
    components:
      - kind: button
        label: 上一题
        variant: secondary
      - kind: button
        label: 下一题
        variant: secondary

  - id: answer_sheet
    type: action_bar
    label: 答题卡
    layout:
      direction: column
      gap: 12
      padding: 16
    constraints:
      primary_actions_max: 1
    components:
      - kind: button
        label: 提交考卷
        variant: danger
