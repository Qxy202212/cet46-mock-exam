        data_key: max
      - kind: table_column
        label: 得分
        data_key: got
      - kind: table_column
        label: 正确答案
        data_key: answer

  - id: drawer
    type: form_section
    label: 解析抽屉
    layout:
      direction: column
      gap: 16
      padding: 24
    components:
      - kind: text
        label: 题型
        sample_value: 仔细阅读
      - kind: text
        label: 我的答案
        sample_value: A
      - kind: text
        label: 标准答案
