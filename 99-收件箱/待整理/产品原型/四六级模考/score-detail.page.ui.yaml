      - kind: kpi_card
        label: 实得
        sample_value: "46"
      - kind: text
        label: 满分
        sample_value: 总分79

  - id: tabs
    type: tabs
    label: 题型分项
    layout:
      direction: row
      gap: 16
      padding: 16
