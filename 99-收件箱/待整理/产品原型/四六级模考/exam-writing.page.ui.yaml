meta:
  page_id: exam-writing
  page_name: 考场·写作
  surface: b_end
  page_type: b_detail_page
  anti_slop: pass
  design_plan_ref: design-plan.md
  canvas:
    width: 1440
    height: 900
  figma:
    file_key: "1PNr2U2fqyc9ppB7YYMbuR"
    frame_name: "P05-考场-写作"
    frame_node_id: ""

shell:
  type: none
  title: 2026年英语四级考试真题一

regions:
  - id: exam_topbar
    type: page_header
    label: 考场顶栏
    layout:
      direction: row
      gap: 12
      padding: 12
    components:
      - kind: text
        label: 试卷名
        sample_value: 2026年英语四级考试真题一
      - kind: text
        label: 剩余时间
        sample_value: 477分36秒
      - kind: button
        label: 退出考场
        variant: danger

  - id: summary_strip
    type: summary_strip
    label: 模式条
    layout:
      direction: row
      gap: 12
      padding: 16
    components:
      - kind: button
        label: 单题模式
        variant: primary
      - kind: button
        label: 整卷模式
        variant: secondary

  - id: tabs
    type: tabs
    label: 答题卡分组
    layout:
      direction: column
      gap: 8
      padding: 16
    components:
      - kind: tab
        label: 写作 17
      - kind: tab
        label: 听力 1 2
      - kind: tab
        label: 选词 26–34
      - kind: tab
        label: 匹配 36 37
      - kind: tab
        label: 仔细 46 47
      - kind: tab
        label: 翻译 16

  - id: question_block
    type: form_section
    label: 写作作答
    layout:
      direction: column
      gap: 8
      padding: 24
    components:
      - kind: text
        label: 标题
        sample_value: 写作
      - kind: text
        label: 要求
        sample_value: Directions: For this part, you are allowed 30 minutes to write an essay.
      - kind: text
        label: 题目
        sample_value: The Value of a Weekly Operation Report
      - kind: input
        label: 作文框
        sample_value: 请在此输入作文

  - id: nav_bar
    type: action_bar
    label: 题间导航
    layout:
      direction: row
      gap: 8
      padding: 16
    constraints:
      primary_actions_max: 1
    components:
      - kind: button
        label: 上一题
        variant: secondary
      - kind: button
        label: 下一题
        variant: secondary

  - id: answer_sheet
    type: action_bar
    label: 答题卡
    layout:
      direction: column
      gap: 12
      padding: 16
    constraints:
      primary_actions_max: 1
    components:
      - kind: text
        label: 进度
        sample_value: 0/17
      - kind: button
        label: 提交考卷
        variant: danger
