meta:
  page_id: exam-translation
  page_name: 考场·翻译
  surface: b_end
  page_type: b_detail_page
  anti_slop: pass
  design_plan_ref: design-plan.md
  canvas:
    width: 1440
    height: 900
  figma:
    file_key: "1PNr2U2fqyc9ppB7YYMbuR"
    frame_name: "P09-考场-翻译"
    frame_node_id: ""

shell:
  type: none
  title: 2026年英语四级考试真题一

regions:
  - id: exam_topbar
    type: page_header
    label: 考场顶栏
    layout:
      direction: row
      gap: 12
      padding: 12
    components:
      - kind: text
        label: 试卷名
        sample_value: 2026年英语四级考试真题一
      - kind: text
        label: 剩余时间
        sample_value: 477分36秒
      - kind: button
        label: 退出考场
        variant: danger

  - id: summary_strip
    type: summary_strip
    label: 模式条
    layout:
      direction: row
      gap: 12
      padding: 16
    components:
      - kind: button
        label: 单题模式
        variant: primary
      - kind: button
        label: 整卷模式
        variant: secondary

  - id: tabs
    type: tabs
    label: 答题卡分组
    layout:
      direction: column
      gap: 8
      padding: 16
    components:
      - kind: tab
        label: 翻译 16 当前

  - id: question_block
    type: form_section
    label: 翻译作答
    layout:
      direction: column
      gap: 8
      padding: 24
    components:
      - kind: text
        label: 标题
        sample_value: 翻译
      - kind: text
        label: 原文
        sample_value: 云顶咖啡是校内一家小型连锁门店。每周一，店长都会根据上一周的销售流水，整理一份运营分析周报。
      - kind: input
        label: 译文框
        sample_value: 请在此输入英文译文

  - id: nav_bar
    type: action_bar
    label: 题间导航
    layout:
      direction: row
      gap: 8
      padding: 16
    constraints:
      primary_actions_max: 1
    components:
      - kind: button
        label: 上一题
        variant: secondary
      - kind: button
        label: 下一题
        variant: secondary

  - id: answer_sheet
    type: action_bar
    label: 答题卡
    layout:
      direction: column
      gap: 12
      padding: 16
    constraints:
      primary_actions_max: 1
    components:
      - kind: button
        label: 提交考卷
        variant: danger
