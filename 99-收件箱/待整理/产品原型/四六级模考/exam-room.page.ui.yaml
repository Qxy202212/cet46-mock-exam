meta:
  page_id: exam-room
  page_name: 考场作答
  surface: b_end
  page_type: b_detail_page
  anti_slop: pass
  design_plan_ref: design-plan.md
  canvas:
    width: 1440
    height: 900
  figma:
    file_key: "1PNr2U2fqyc9ppB7YYMbuR"
    frame_name: "P03-考场-听力"
    frame_node_id: "1:4"

shell:
  type: none
  title: 2026年英语四级考试真题一

regions:
  - id: exam_topbar
    type: page_header
    label: 考场顶栏
    layout:
      direction: row
      gap: 12
      padding: 12
    components:
      - kind: text
        label: 试卷名
        sample_value: 2026年英语四级考试真题一
      - kind: avatar
        label: 邱老师
      - kind: text
        label: 剩余时间
        sample_value: 477分36秒
      - kind: button
        label: 退出考场
        variant: danger

  - id: summary_strip
    type: summary_strip
    label: 模式条
    layout:
      direction: row
      gap: 12
      padding: 16
    components:
      - kind: button
        label: 单题模式
        variant: primary
      - kind: button
        label: 整卷模式
        variant: secondary
      - kind: button
        label: 标记
        variant: ghost
      - kind: button
        label: 收藏
        variant: ghost

  - id: tabs
    type: tabs
    label: 答题卡分组
    layout:
      direction: column
      gap: 8
      padding: 16
    components:
      - kind: tab
        label: 听力
      - kind: tab
        label: Section A 选词填空
      - kind: tab
        label: Section B 信息匹配
      - kind: tab
        label: Section C 篇章阅读
      - kind: tab
        label: 翻译
      - kind: tab
        label: 写作

  - id: parent_panel
    type: form_section
    label: 母题区
    layout:
      direction: column
      gap: 8
      padding: 24
    components:
      - kind: text
        label: 听力理解
        sample_value: Conversation One

  - id: question_block
    type: form_section
    label: 子题作答
    layout:
      direction: column
      gap: 8
      padding: 16
    components:
      - kind: text
        label: 题干
        sample_value: Question 1. What does the woman mean?
      - kind: list_item
        label: A
        sample_value: She will finish the report after class.

  - id: nav_bar
    type: action_bar
    label: 题间导航
    layout:
      direction: row
      gap: 8
      padding: 16
    constraints:
      primary_actions_max: 1
    components:
      - kind: button
        label: 上一题
        variant: secondary
      - kind: button
        label: 下一题
        variant: secondary

  - id: answer_sheet
    type: action_bar
    label: 答题卡
    layout:
      direction: column
      gap: 12
      padding: 16
    constraints:
      primary_actions_max: 1
    components:
      - kind: text
        label: 进度
        sample_value: 0/17
      - kind: button
        label: 提交考卷
        variant: danger
