  --kd-border-radius-extra-large: 12px;
  --kd-border-radius-circle:      999px;

  /* ══ Icon Stroke ═════════════════════════════════════════════════ */

  --kd-stroke-width-icon-regular: 1;
  --kd-stroke-width-icon-bold:    1.2;

  /* ══ Transitions ═════════════════════════════════════════════════ */

  --kd-all-transition:          all 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
  --kd-fade-transition:         opacity 300ms cubic-bezier(0.23, 1, 0.32, 1);
  --kd-fade-linear-transition:  opacity 200ms linear;

  --kd-border-transition-base:  border-color 0.2s cubic-bezier(0.645, 0.045, 0.355, 1);
  --kd-color-transition-base:   color 0.2s cubic-bezier(0.645, 0.045, 0.355, 1);

  /* ══ Z-Index ═════════════════════════════════════════════════════ */

  --kd-z-index-invisible: -100;

  --kd-z-index-popupmenu: 1040;

  /* ══ Opacity & Custom ════════════════════════════════════════════ */

  /* ══ Backward-Compatible Aliases ═════════════════════════════════

  --kd-font-size-xs:  var(--kd-font-size-extra-small);
  --kd-font-size-xl:  var(--kd-font-size-extra-large);

  --kd-time-fast:   120ms;

  --kd-easing-ease: cubic-bezier(.25, .10, .25, 1.00);
}

/* @kd-registry: reset v2.0 */
/* ══════════════════════════════════════════════════════════════
   KDesign 全局重置
   ══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: var(--kd-font-size-base);
  color: var(--kd-color-text-primary);
  background: var(--kd-color-background-base);
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }
button { border: none; background: transparent; font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { min-width: 0; max-width: 100%; }
img, video, canvas, svg { max-width: 100%; }

/* @kd-registry: button v2.0 */
/* ══ Button 按钮 ══ */

.kd-button {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: inherit; font-weight: var(--kd-font-weight-regular);
  line-height: var(--kd-line-height-base);
  border: 1px solid transparent; border-radius: var(--kd-border-radius-middle);
  cursor: pointer; white-space: nowrap; user-select: none; outline: none;
  transition: background var(--kd-time-fast) var(--kd-easing-ease),
              border-color var(--kd-time-fast) var(--kd-easing-ease),
              color var(--kd-time-fast) var(--kd-easing-ease);
}
.kd-button-children { display: inline-flex; align-items: center; }
.kd-button-prefix-icon { margin-right: 4px; font-size: 16px; display: inline-flex; }
.kd-button-suffix-icon { margin-left: 4px; font-size: 16px; display: inline-flex; }

/* Size */
.kd-button-sm { height: 24px; padding: 0 5px;    font-size: var(--kd-font-size-sub-base); border-radius: var(--kd-border-radius-small); }
.kd-button-m  { height: 28px; padding: 2px 11px; font-size: var(--kd-font-size-sub-base); }
.kd-button-lg { height: 32px; padding: 4px 15px; font-size: var(--kd-font-size-sub-base); }
.kd-button-xl { height: 36px; padding: 6px 19px; font-size: var(--kd-font-size-middle); }
.kd-button-light.kd-button-m { padding: 2px 8px; }

/* Primary */
.kd-button-primary { background: var(--kd-color-public-normal); color: var(--kd-color-text-white); }
.kd-button-primary:hover:not(:disabled) { background: var(--kd-color-public-hover); }
.kd-button-primary:active:not(:disabled) { background: var(--kd-color-public-pressed); }

/* Secondary */
.kd-button-secondary { background: var(--kd-color-fill-base); color: var(--kd-color-text-primary); border-color: var(--kd-color-fill-heavy); }
.kd-button-secondary:hover:not(:disabled)  { background: var(--kd-color-fill-light); }
.kd-button-secondary:active:not(:disabled) { background: var(--kd-color-fill-regular); }

/* Light */
.kd-button-light { background: transparent; color: var(--kd-color-text-primary); }
.kd-button-light:hover:not(:disabled)  { background: var(--kd-color-state-hover); }
.kd-button-light:active:not(:disabled) { background: var(--kd-color-state-pressed); }

/* Danger */
.kd-button-light.kd-button-danger  { color: var(--kd-color-error-normal); }
.kd-button-primary.kd-button-danger { background: var(--kd-color-error-normal); }
.kd-button-primary.kd-button-danger:hover:not(:disabled)  { background: var(--kd-color-error-hover); }
.kd-button-primary.kd-button-danger:active:not(:disabled) { background: var(--kd-color-error-pressed); }

/* Disabled */
.kd-button:disabled { opacity: var(--kd-opacity-disabled); cursor: not-allowed; pointer-events: none; }

/* Icon-only */
.kd-button-icon.kd-button-sm { min-width: 24px; padding: 3px; }
.kd-button-icon.kd-button-m  { min-width: 28px; padding: 5px; }
.kd-button-icon.kd-button-lg { min-width: 32px; padding: 7px; }
.kd-button-icon.kd-button-xl { min-width: 36px; padding: 9px; }

/* @kd-registry: input v2.0 */
/* ══ Input 输入框 ══ */

.kd-input-wrap {
  display: inline-flex; align-items: center; width: 100%;
  background: var(--kd-color-fill-base);
  border: 1px solid var(--kd-color-line-regular);
  border-radius: var(--kd-border-radius-middle);
  padding: 0 4px 0 8px;
  transition: border-color var(--kd-time-fast);
  box-sizing: border-box;
}
.kd-input-wrap > * + * { margin-left: 8px; }

/* Hover / Focus / Error / Disabled */
.kd-input:hover:not(.is-disabled):not(.kd-input-status-error) .kd-input-wrap { border-color: var(--kd-color-line-medium); }
.kd-input.is-focus .kd-input-wrap,
.kd-input-wrap:focus-within { border-color: var(--kd-color-line-public) !important; }
.kd-input-status-error .kd-input-wrap { border-color: var(--kd-color-error-normal) !important; box-shadow: none; }
.kd-input.is-disabled .kd-input-wrap { background: var(--kd-color-fill-regular); border-color: var(--kd-color-line-heavy); opacity: var(--kd-opacity-disabled); }

/* Size — min-height on wrap guarantees height even if .kd-input-inner is missing */
.kd-input-small .kd-input-wrap  { border-radius: var(--kd-border-radius-small); min-height: 24px; }
.kd-input-medium .kd-input-wrap { min-height: 28px; }
.kd-input-large .kd-input-wrap  { min-height: 32px; }
.kd-input-x-large .kd-input-wrap { min-height: 36px; }
.kd-input-small .kd-input-inner { height: 22px; padding: 0; }
.kd-input-medium .kd-input-inner { padding: 2px 0; }
.kd-input-large .kd-input-inner  { padding: 4px 0; }
.kd-input-x-large .kd-input-inner { padding: 6px 0; }

/* Inner */
.kd-input-inner {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: var(--kd-font-size-sub-base); color: var(--kd-color-text-primary);
  line-height: var(--kd-line-height-base); padding: 4px 0; min-width: 0;
}
.kd-input-inner::placeholder { color: var(--kd-color-text-tertiary); }
.kd-input-inner:disabled { cursor: not-allowed; color: var(--kd-color-text-tertiary); }

/* Prefix / Suffix (decorative) */
.kd-input-prefix,
.kd-input-suffix {
  flex-shrink: 0; display: flex; align-items: center;
  color: var(--kd-color-icon-secondary);
}
.kd-input-prefix svg,
.kd-input-suffix svg { display: block; width: 16px; height: 16px; }

/* Icon button inside Input (clickable) */
.kd-input-icon {
  flex-shrink: 0; color: var(--kd-color-icon-secondary);
  font-size: var(--kd-font-size-base);
  display: flex; align-items: center;
  border: none; background: transparent;
  padding: 4px; border-radius: var(--kd-border-radius-small); cursor: pointer;
}
.kd-input-icon:hover { color: var(--kd-color-text-secondary); }

/* @kd-registry: checkbox v2.0 */
/* ══ Checkbox 复选框 ══ */

.kd-checkbox { display: inline-flex; align-items: center; cursor: pointer; user-select: none; }
.kd-checkbox-input { position: relative; display: inline-flex; align-items: center; }
.kd-checkbox-inner {
  width: 14px; height: 14px;
  border: 1px solid var(--kd-color-line-heavy);
  border-radius: var(--kd-border-radius-extra-small);
  background: var(--kd-color-fill-base);
  display: block; position: relative;
  transition: background .25s cubic-bezier(.71,-.46,.29,1.46),
              border-color .25s cubic-bezier(.71,-.46,.29,1.46);
}
.kd-checkbox-original { position: absolute; opacity: 0; width: 0; height: 0; }

/* Checked (class-based) */
.kd-checkbox-input.is-checked .kd-checkbox-inner {
  background: var(--kd-color-public-normal); border-color: transparent;
}
.kd-checkbox-input.is-checked .kd-checkbox-inner::after {
  content: ''; position: absolute;
  box-sizing: content-box;
  top: 1px; left: 4px; width: 3px; height: 6px;
  border: 2px solid var(--kd-color-text-white); border-top: none; border-left: none;
  transform: rotate(45deg);
  transition: transform .15s cubic-bezier(.71,-.46,.88,.6) .05s;
}

/* Indeterminate */
.kd-checkbox-input.is-indeterminate .kd-checkbox-inner {
  background: var(--kd-color-public-normal); border-color: transparent;
}
.kd-checkbox-input.is-indeterminate .kd-checkbox-inner::before {
  content: ''; position: absolute;
  top: 50%; left: 3px; right: 3px; margin-top: -1px;
  border-top: 2px solid var(--kd-color-text-white);
}

/* Hover */
.kd-checkbox-input:hover:not(.is-disabled) .kd-checkbox-inner { border-color: var(--kd-color-public-normal); }
.kd-checkbox-input.is-checked:hover:not(.is-disabled) .kd-checkbox-inner { background: var(--kd-color-public-hover); }

/* Disabled */
.kd-checkbox-input.is-disabled { pointer-events: none; }
.kd-checkbox-input.is-disabled .kd-checkbox-inner {
  background: var(--kd-color-fill-light); border-color: var(--kd-color-fill-heavy);
}
.kd-checkbox-input.is-disabled ~ .kd-checkbox-label { color: var(--kd-color-text-secondary); }
.kd-checkbox.is-disabled { cursor: not-allowed; }

.kd-checkbox-label { padding-left: 4px; font-size: var(--kd-font-size-sub-base); line-height: 20px; }

/* @kd-registry: select v3.0 */
/* ══ Select 下拉选择 ══ */

/* 触发器复用 Input 样式，仅补充 Select 特有部分 */
.kd-select-trigger { position: relative; cursor: pointer; }
.kd-select-trigger .kd-input-wrap { cursor: pointer; }
.kd-select-trigger .kd-input-inner { cursor: pointer; }

/* 箭头 */
.kd-select-arrow {
  display: flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; flex-shrink: 0;
  color: var(--kd-color-icon-secondary);
  transition: transform var(--kd-time-fast);
}
.kd-select-trigger.is-open .kd-select-arrow { transform: rotate(180deg); }
.kd-select-trigger.is-open .kd-input-wrap { border-color: var(--kd-color-line-public); }

/* Status: error / warning */
.kd-select-status-error .kd-input-wrap { border-color: var(--kd-color-error-normal) !important; }
.kd-select-status-warning .kd-input-wrap { border-color: #E2651A !important; }

/* Disabled */
.kd-select-trigger.is-disabled { pointer-events: none; }
.kd-select-trigger.is-disabled .kd-input-wrap {
  background: var(--kd-color-fill-regular);
  border-color: var(--kd-color-line-heavy);
  opacity: var(--kd-opacity-disabled);
}

/* Clear button (replaces arrow on hover when value exists) */
.kd-select-clear {
  display: none; align-items: center; justify-content: center;
  width: 16px; height: 16px; flex-shrink: 0;
  border: none; background: transparent; cursor: pointer;
  color: var(--kd-color-icon-secondary);
  border-radius: 50%;
}
.kd-select-clear:hover { color: var(--kd-color-text-secondary); }
.kd-input.has-value[data-select-clearable]:hover .kd-select-clear { display: flex; }
.kd-input.has-value[data-select-clearable]:hover .kd-select-arrow { display: none; }

/* 下拉面板 */
.kd-select-dropdown {
  position: absolute; z-index: 1050; margin-top: 4px;
  min-width: 100%;
}
/* 下拉面板内的 menu 直接作为容器，不再双层背景 */
.kd-select-dropdown > .kd-menu {
  margin: 0;
}

/* 分组标题 */
.kd-select-group-title {
  font-size: 12px; color: var(--kd-color-text-tertiary);
  padding: 4px 8px; font-weight: 600;
  line-height: 18px;
}

/* 空状态 */
.kd-select-empty {
  text-align: center; padding: 24px 0;
  font-size: var(--kd-font-size-sub-base);
  color: var(--kd-color-text-tertiary);
}

/* 多选 Tag */
.kd-select[data-select-mode="multiple"] .kd-input-wrap { padding-left: 4px; }
.kd-select-tag {
  display: inline-flex; align-items: center;
  padding: 2px 4px 2px 8px; margin: 2px 4px 2px 0;
  background: var(--kd-color-fill-light);
  border-radius: var(--kd-border-radius-small);
  font-size: var(--kd-font-size-sub-base);
  line-height: 18px; max-width: 100%;
}
.kd-select-tag-close {
  display: flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; margin-left: 2px;
  border: none; background: transparent; cursor: pointer;
  color: var(--kd-color-icon-secondary);
  border-radius: 50%; flex-shrink: 0;
}
.kd-select-tag-close:hover { color: var(--kd-color-text-secondary); background: var(--kd-color-fill-regular); }

/* 多选折叠计数 */
.kd-select-tag-count {
  display: inline-flex; align-items: center;
  padding: 2px 8px; margin: 2px 0 2px 4px;
  background: var(--kd-color-fill-light);
  border-radius: var(--kd-border-radius-small);
  font-size: var(--kd-font-size-sub-base);
  color: var(--kd-color-text-secondary);
}

/* @kd-registry: menu v2.0 */
/* ══ Menu 下拉菜单 / 右键菜单 ══ */

.kd-menu {
  position: relative; padding: 8px;
  background: var(--kd-color-fill-base);
  border: 1px solid var(--kd-color-line-regular);
  box-shadow: var(--kd-box-shadow-large);
  border-radius: var(--kd-border-radius-large);
  list-style: none;
}
.kd-menu-item {
  position: relative; display: flex;
  padding: 5px 8px; margin-bottom: 4px;
  font-size: var(--kd-font-size-sub-base); font-weight: var(--kd-font-weight-regular);
  line-height: var(--kd-line-height-base); color: var(--kd-color-text-primary);
  white-space: nowrap; border-radius: var(--kd-border-radius-middle);
  align-items: flex-start; user-select: none; cursor: pointer;
}
.kd-menu-item:last-child { margin-bottom: 0; }
.kd-menu-item:hover  { background: var(--kd-color-state-hover); }
.kd-menu-item:active { background: var(--kd-color-state-pressed); }
.kd-menu-item-disabled { cursor: not-allowed; opacity: 0.3; }
.kd-menu-item-icon {
  position: relative; top: 4px; margin-right: 6px;
  width: 16px; height: 16px; flex-shrink: 0;
}

/* Selectable mode */
.kd-menu-selectable .kd-menu-item { padding-left: 24px; }
.kd-menu-item-tick {
  position: absolute; top: 50%; left: 4px;
  transform: translateY(-50%);
  display: flex; align-items: center; justify-content: center;
  width: 16px; height: 16px;
}

.kd-menu-divider { height: 1px; margin: 4px 0; background: var(--kd-color-line-regular); }
.kd-menu-group-title {
  padding: 8px 8px 2px;
  font-size: var(--kd-font-size-sub-base); font-weight: var(--kd-font-weight-bold);
  line-height: var(--kd-line-height-base); color: var(--kd-color-text-primary);
}

/* @kd-registry: table v2.0 */
/* ══ Table 表格 ══ */

.kd-table {
  position: relative;
  width: 100%; font-size: var(--kd-font-size-base);
  color: var(--kd-color-text-primary); border-radius: 2px 2px 0 0;
}
.kd-table table { width: 100%; border-collapse: collapse; table-layout: fixed; }

/* ── Header ── */
.kd-table-header-tr { height: 36px; background: var(--kd-color-fill-light); }
.kd-table-header-th {
  padding: 0 12px; font-size: var(--kd-font-size-sub-base);
  font-weight: var(--kd-font-weight-regular); color: var(--kd-color-text-primary);
  text-align: left; white-space: nowrap;
}

/* ── Cell ── */
.kd-table-cell {
  padding: 16px 12px; line-height: 24px;
  border-bottom: 1px solid var(--kd-color-fill-light);
  max-height: 56px; overflow: hidden; text-overflow: ellipsis;
}

/* ── Cell alignment ── */
.kd-table-cell-center, .kd-table-header-th.kd-table-cell-center { text-align: center; }
.kd-table-cell-right, .kd-table-header-th.kd-table-cell-right { text-align: right; }

/* ── Row hover ── */
.kd-table-row:hover .kd-table-cell { background: var(--kd-color-state-hover); }
.kd-table-row:hover .kd-table-cell:first-child { border-radius: var(--kd-border-radius-large) 0 0 var(--kd-border-radius-large); }
.kd-table-row:hover .kd-table-cell:last-child  { border-radius: 0 var(--kd-border-radius-large) var(--kd-border-radius-large) 0; }
.kd-table-row:hover .kd-table-cell { border-bottom-color: var(--kd-color-fill-base); }

/* ── Row selected ── */
.kd-table-row.is-selected .kd-table-cell { background: var(--kd-color-state-pressed-public); }

/* ── Row disabled ── */
.kd-table-row.is-disabled { pointer-events: none; }
.kd-table-row.is-disabled .kd-table-cell { opacity: var(--kd-opacity-disabled); color: var(--kd-color-text-secondary); }

/* ══ Bordered variant ══ */
.kd-table-bordered { border: 1px solid var(--kd-color-line-regular); border-radius: var(--kd-border-radius-large); overflow: hidden; }
.kd-table-bordered .kd-table-header-th { border-right: 1px solid var(--kd-color-line-regular); border-bottom: 1px solid var(--kd-color-line-regular); }
.kd-table-bordered .kd-table-header-th:last-child { border-right: none; }
.kd-table-bordered .kd-table-cell { border-right: 1px solid var(--kd-color-fill-light); }
.kd-table-bordered .kd-table-cell:last-child { border-right: none; }
.kd-table-bordered .kd-table-row:hover .kd-table-cell:first-child { border-radius: 0; }
.kd-table-bordered .kd-table-row:hover .kd-table-cell:last-child { border-radius: 0; }

/* ══ Striped variant ══ */
.kd-table-striped .kd-table-row:nth-child(even) .kd-table-cell { background: var(--kd-color-fill-light); }
.kd-table-striped .kd-table-row:nth-child(even):hover .kd-table-cell { background: var(--kd-color-state-hover); }

/* ══ Fixed header ══ */
.kd-table-fixed-header { overflow-y: auto; }
.kd-table-fixed-header .kd-table-header-tr { position: sticky; top: 0; z-index: 2; }
.kd-table-fixed-header .kd-table-header-th { background: var(--kd-color-fill-light); }

/* ══ Hidden header ══ */
.kd-table-no-header thead { display: none; }

/* ══ Selection column ══ */
.kd-table-th-select, .kd-table-cell-select {
  width: 48px; text-align: center; padding: 0 8px;
}

/* ══ Expand column ══ */
.kd-table-cell-expand { width: 40px; text-align: center; padding: 0 8px; }
.kd-table-expand-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; cursor: pointer;
  color: var(--kd-color-text-secondary); font-size: 12px;
  border-radius: var(--kd-border-radius-small); transition: background var(--kd-time-fast);
}
.kd-table-expand-icon:hover { background: var(--kd-color-state-hover); }
.kd-table-expand-icon.is-expanded { color: var(--kd-color-text-primary); }

/* Expanded row */
.kd-table-expanded-row .kd-table-expanded-cell { padding: 0; border-bottom: 1px solid var(--kd-color-fill-light); }
.kd-table-expanded-content { padding: 12px 12px 12px 52px; background: var(--kd-color-fill-light); font-size: var(--kd-font-size-sub-base); line-height: 20px; color: var(--kd-color-text-secondary); }

/* ══ Empty state ══ */
.kd-table-row-empty .kd-table-cell { border-bottom: none; }
.kd-table-empty {
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  padding: 40px 0; color: var(--kd-color-text-placeholder); font-size: var(--kd-font-size-sub-base);
}

/* ══ Loading overlay ══ */
.kd-table-loading { position: relative; }
.kd-table-loading table { opacity: 0.4; pointer-events: none; }
.kd-table-loading-overlay {
  position: absolute; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, 0.6); border-radius: inherit;
}

/* @kd-registry: modal v2.0 */
/* ══ Modal 弹窗 ══ */

/* Mask */
.kd-modal-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 999;
}
.kd-modal-wrap {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
}

/* Shell sizes */
.kd-modal-sm .kd-modal-content { width: 480px; }
.kd-modal-md .kd-modal-content { width: 640px; }
.kd-modal-lg .kd-modal-content { width: 800px; }

/* Content shell (底板色) */
.kd-modal-content {
  background: var(--kd-color-background-plate);
  border: 1px solid var(--kd-color-line-regular);
  border-radius: var(--kd-border-radius-extra-large);
  box-shadow: var(--kd-box-shadow-extra-large);
  box-sizing: border-box;
  animation: kd-modal-in .3s ease forwards;
}
@keyframes kd-modal-in {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Header */
.kd-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  height: 44px; padding: 10px 12px 0 16px; gap: 4px;
}
.kd-modal-title {
  font-size: var(--kd-font-size-base); font-weight: var(--kd-font-weight-bold);
  line-height: var(--kd-line-height-base); color: var(--kd-color-text-primary);
}
.kd-modal-close {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent;
  border-radius: var(--kd-border-radius-small); cursor: pointer;
  color: var(--kd-color-icon-secondary);
  transition: background var(--kd-time-fast);
}
.kd-modal-close:hover { background: var(--kd-color-state-hover); }

/* ── C1/C2：内容区直接在底板上 ── */
.kd-modal-body-wrap { padding: 4px 16px 8px; }

/* ── C3：wrap padding 更窄（留给白卡片自身 padding） ── */
.kd-modal-body-wrap-c3 { padding: 0 16px; }

/* Tabs 置于 Header 和白卡片之间（仅 C3b） */
.kd-modal-body-wrap .kd-tabs { padding-bottom: 8px; }

/* ── C3 白色内容卡片 ── */
.kd-modal-body-card {
  background: var(--kd-color-background-bottom);
  border-radius: var(--kd-border-radius-extra-large);
  padding: 12px;
}

/* C3a 多卡片容器 */
.kd-modal-body-multi { display: flex; flex-direction: column; gap: 8px; }
.kd-modal-body-card-c3 { padding: 12px; }

/* Sections */
.kd-modal-section { display: flex; flex-direction: column; gap: 4px; }
.kd-modal-section + .kd-modal-section { margin-top: 16px; }
.kd-modal-section-title {
  font-size: var(--kd-font-size-sub-base); font-weight: var(--kd-font-weight-bold);
  line-height: 20px; color: var(--kd-color-text-primary);
}

/* Field label (400, not bold) */
.kd-field-label {
  font-size: var(--kd-font-size-sub-base); font-weight: var(--kd-font-weight-regular);
  line-height: 20px; color: var(--kd-color-text-primary);
}

/* Footer */
.kd-modal-footer {
  display: flex; align-items: center;
  gap: 16px; padding: 16px;
  justify-content: flex-end;
}
.kd-modal-footer.has-left { justify-content: space-between; }
.kd-modal-footer-left,
.kd-modal-footer-right { display: flex; align-items: center; gap: 8px; }
.kd-modal-footer-left:empty { display: none; }

/* @kd-registry: segmented v2.0 */
/* ══ Segmented 分段控制器 ══ */

.kd-segmented-controller {
  display: inline-flex; gap: 2px;
  padding: 2px;
  border: 1px solid var(--kd-color-line-regular);
  border-radius: var(--kd-border-radius-middle);
  background: var(--kd-color-fill-base);
}
.kd-segmented-item { flex: 1; }
.kd-segmented-item .kd-button { width: 100%; }

/* Active state override */
.kd-segmented-item.is-active .kd-button {
  background: var(--kd-color-state-pressed);
  font-weight: var(--kd-font-weight-bold);
}

/* @kd-registry: message v2.0 */
/* ══ Message 全局提示 ══ */

.kd-message-root {
  position: fixed; top: 88px; left: 50%; transform: translateX(-50%);
  z-index: 9000; display: flex; flex-direction: column; align-items: center;
  gap: 8px; pointer-events: none;
}
.kd-message {
  display: inline-flex; align-items: center;
  padding: 9px 20px; border-radius: var(--kd-border-radius-large);
  border: 1px solid; box-shadow: var(--kd-box-shadow-large);
  font-size: var(--kd-font-size-sub-base); line-height: var(--kd-line-height-base);
  pointer-events: auto;
  animation: kd-toast-in .3s ease forwards;
}
@keyframes kd-toast-in {
  from { opacity: 0; transform: translateY(-90%); }
  to   { opacity: 1; transform: translateY(0); }
}
.kd-message-icon { flex-shrink: 0; display: inline-flex; align-items: center; line-height: 1; }
.kd-message-text { margin-left: 8px; color: var(--kd-color-text-primary); line-height: var(--kd-line-height-base); }

.kd-message-success { background: var(--kd-color-success-light); border-color: var(--kd-color-success-normal); }
.kd-message-error   { background: var(--kd-color-error-light);   border-color: var(--kd-color-error-normal); }
.kd-message-warning { background: var(--kd-color-warning-light); border-color: var(--kd-color-warning-normal); }
.kd-message-info,
.kd-message-loading { background: var(--kd-color-info-light);    border-color: var(--kd-color-public-normal); }

/* @kd-scene: saas-admin-console table-list-page pagination v1.0 */
.pagination-area {
  height: 52px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex: 0 0 52px;
}

.pagination-area.is-sticky {
  position: sticky;
  bottom: 0;
  z-index: 4;
  background: var(--kd-color-background-bottom);
  box-shadow: 0 -1px 0 var(--kd-color-line-light);
}

.pagination-area .pagination-summary {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 13px;
  line-height: 20px;
  color: var(--kd-color-text-primary);
}

.pagination-area .pagination-main {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 16px;
  column-gap: 16px;
}

.pagination-area .page-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.pagination-area .page-extra {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  column-gap: 16px;
}

.pagination-area .page-extra .page-extra {
  gap: 8px;
  column-gap: 8px;
}

.pagination-area .page-link {
  min-width: 28px;
  height: 28px;
  padding: 0 8px;
  border: 1px solid transparent;
  border-radius: var(--kd-radius-md);
  background: transparent;
  color: var(--kd-color-text-primary);
  display: inline-flex;

.pagination-area .page-size-field .kd-select-arrow {
  margin-left: 8px;
}

.pagination-area .jump-field {
  width: 48px;
  min-width: 48px;
}

.pagination-area .jump-field .kd-input-wrap {
  padding-left: 7px;
  padding-right: 7px;
  justify-content: center;
}

.pagination-area .jump-field .kd-input-inner {
  text-align: center;

    /* ══ 页面布局样式 ══ */
    [hidden] { display: none !important; }

    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #addMask { z-index: 1100; }
    #addWrap { z-index: 1101; }
    #confirmMask { z-index: 1200; }
    #confirmWrap { z-index: 1201; }

    .dist-modal .kd-modal-content {
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
    }
    .dist-modal .kd-modal-body-wrap {
      min-height: 0;
      overflow: auto;
    }

    .scope-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 8px;
    }
    .scope-bar .kd-segmented-controller { min-width: 240px; }
    .scope-bar .kd-field-label { flex-shrink: 0; }

    .scope-hint,
    .field-hint,
    .all-sub,
    .confirm-text {
      font-size: var(--kd-font-size-sub-base);
      line-height: 20px;
      color: var(--kd-color-text-secondary);
    }
    .scope-hint { padding-bottom: 8px; }
    .all-lead {
      font-size: var(--kd-font-size-sub-base);
      line-height: 20px;
      color: var(--kd-color-text-primary);
    }
    .all-pane { display: flex; flex-direction: column; gap: 4px; padding: 12px 0 16px; }
    .confirm-text { color: var(--kd-color-text-primary); }
    .field-hint { margin-top: 4px; }

    .kd-field { display: flex; flex-direction: column; gap: 4px; }
    .req-mark { color: var(--kd-color-text-error); margin-right: 4px; }

    .dist-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
    }
    .list-search { flex: 1; min-width: 0; display: block; }
    .dist-toolbar .kd-button { flex-shrink: 0; }

    .dist-table-scroll {
      max-height: calc(100vh - 300px);
      min-height: 180px;
      overflow: auto;
    }
    .dist-table .kd-table-header-th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--kd-color-fill-light);
    }
    .dist-table .kd-table-cell,
    .dist-table .kd-table-header-th {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-cell {
      text-align: center;
      color: var(--kd-color-text-secondary);
      white-space: normal;
    }

    .kd-modal-footer .kd-button { min-width: 72px; }

    .add-select { position: relative; z-index: 2; }
    .add-select .kd-input-wrap {
      flex-wrap: wrap;
      height: auto;
      min-height: 28px;
    }
    .add-select .kd-input-inner { flex: 1 1 140px; min-width: 140px; }
    .add-select .kd-select-arrow { margin-left: auto; }
    .add-select .kd-select-dropdown { display: none; left: 0; right: 0; top: 100%; }
    .add-select .kd-select-trigger.is-open .kd-select-dropdown { display: block; }
    .add-menu-scroll { max-height: 280px; overflow: auto; }

    .add-option { align-items: center; }
    .add-option .kd-checkbox { flex: 1; min-width: 0; pointer-events: none; }
    .add-option .kd-checkbox-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .add-option.is-locked { cursor: not-allowed; }
    .add-option.is-locked:hover,
    .add-option.is-locked:active { background: transparent; }
    .add-option.is-locked .kd-checkbox-label,
    .added-mark { color: var(--kd-color-text-tertiary); }
    .added-mark {
      flex-shrink: 0;
      margin-left: 8px;
      font-size: var(--kd-font-size-sub-base);
      line-height: 20px;
    }
    .add-option.is-locked .kd-checkbox-input.is-checked .kd-checkbox-inner {
      background: var(--kd-color-icon-secondary);
      border-color: transparent;
    }

    .kd-button-prefix-icon svg,
    .kd-modal-close svg,
    .kd-input-prefix svg,
    .kd-input-icon svg,
    .kd-select-arrow svg,
    .kd-select-tag-close svg,
    .kd-message-icon svg {
      width: 16px;
      height: 16px;
      max-width: none;
    }
    .kd-modal-close .kd-color-icon-primary,
    .kd-input-prefix .kd-color-icon-primary,
    .kd-input-icon .kd-color-icon-primary,
    .kd-select-arrow .kd-color-icon-primary,
    .kd-select-tag-close .kd-color-icon-primary {
      stroke: var(--kd-color-icon-secondary);
    }
    .kd-button-primary .kd-color-icon-primary {
      stroke: var(--kd-color-text-white);
    }
  </style>

  <script>
    (function initKdAdminPagination(global) {
  var DEFAULT_PAGE_SIZE_OPTIONS = [10, 20, 50];

  function clamp(value, min, max) {
    var next = Number(value);
    if (!Number.isFinite(next)) next = min;
    return Math.max(min, Math.min(max, next));
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderIcon(path) {
    return '' +
      '<span class="kd-icon" aria-hidden="true">' +
        '<svg viewBox="0 0 16 16">' + path + '</svg>' +
      '</span>';
  }

  function createPagination(container, options) {
    if (!container) return null;
    options = options || {};

    var state = {
      currentPage: Number(options.currentPage) || 1,
      pageSize: Number(options.pageSize) || 20,
      total: Number(options.total) || 0,
      selectedCount: Number(options.selectedCount) || 0
    };
    var pageSizeOptions = options.pageSizeOptions || DEFAULT_PAGE_SIZE_OPTIONS;
    var onChange = typeof options.onChange === 'function' ? options.onChange : function() {};

    container.classList.add('pagination-area');
    container.setAttribute('data-kd-component', 'Pagination');
    container.innerHTML = '' +
      '<div class="pagination-summary" data-kd-pagination-summary></div>' +
      '<div class="pagination-main">' +
        '<div class="page-group">' +
          '<button class="page-link page-link-icon" type="button" aria-label="上一页" data-kd-page-prev>' +
            renderIcon('<path d="M9.5 4L6 8L9.5 12"></path>') +
          '</button>' +
          '<div class="page-group" data-kd-page-numbers></div>' +
          '<button class="page-link page-link-icon" type="button" aria-label="下一页" data-kd-page-next>' +
            renderIcon('<path d="M6.5 4L10 8L6.5 12"></path>') +
          '</button>' +
        '</div>' +
        '<div class="page-extra">' +
          '<label class="page-size-field kd-input kd-input-medium kd-select-trigger">' +
            '<span class="sr-only">每页条数</span>' +
            '<span class="kd-input-wrap" data-kd-component="Select">' +
              '<input class="kd-input-inner" type="text" readonly data-kd-page-size-text>' +
              '<span class="kd-select-arrow" aria-hidden="true">' +
                renderIcon('<path d="M4 6.5L8 10L12 6.5"></path>') +
              '</span>' +
            '</span>' +
          '</label>' +
          '<div class="page-extra">' +
            '<span>前往</span>' +
            '<label class="jump-field kd-input kd-input-medium">' +
              '<span class="sr-only">页码输入</span>' +
              '<span class="kd-input-wrap" data-kd-component="Text Field / KDTextField">' +
                '<input class="kd-input-inner" type="text" inputmode="numeric" data-kd-page-jump>' +
              '</span>' +
            '</label>' +
            '<span>页</span>' +
          '</div>' +
        '</div>' +
      '</div>';

    var summary = container.querySelector('[data-kd-pagination-summary]');
    var prevBtn = container.querySelector('[data-kd-page-prev]');
    var nextBtn = container.querySelector('[data-kd-page-next]');
    var pageNumbers = container.querySelector('[data-kd-page-numbers]');
    var pageSizeText = container.querySelector('[data-kd-page-size-text]');
    var jumpInput = container.querySelector('[data-kd-page-jump]');
    var pageSizeTrigger = pageSizeText.closest('.kd-select-trigger');

    function totalPages() {
      return Math.max(1, Math.ceil(state.total / state.pageSize));
    }

    function emit() {
      onChange({
        currentPage: state.currentPage,
        pageSize: state.pageSize,
        total: state.total,
        selectedCount: state.selectedCount,
        totalPages: totalPages()
      });
    }

    function render() {
      var total = totalPages();
      state.currentPage = clamp(state.currentPage, 1, total);
      summary.textContent = '已选 ' + state.selectedCount + ' 条，共 ' + state.total + ' 条';
      pageSizeText.value = state.pageSize + ' 条/页';
      jumpInput.value = state.currentPage;
      prevBtn.disabled = state.currentPage === 1;
      nextBtn.disabled = state.currentPage === total;

      var html = '';
      for (var i = 1; i <= total; i += 1) {
        html += '<button class="page-link' + (i === state.currentPage ? ' is-current' : '') +
          '" type="button" data-kd-page="' + i + '">' + escapeHtml(i) + '</button>';
      }
      pageNumbers.innerHTML = html;
    }

    function setState(nextState, shouldEmit) {
      if (!nextState) return;
      if (nextState.total != null) state.total = Math.max(0, Number(nextState.total) || 0);
      if (nextState.selectedCount != null) state.selectedCount = Math.max(0, Number(nextState.selectedCount) || 0);
      if (nextState.pageSize != null) state.pageSize = Math.max(1, Number(nextState.pageSize) || state.pageSize);
      if (nextState.currentPage != null) state.currentPage = Number(nextState.currentPage) || 1;
      state.currentPage = clamp(state.currentPage, 1, totalPages());
      render();
      if (shouldEmit) emit();
    }

    pageNumbers.addEventListener('click', function(event) {
      var target = event.target.closest('[data-kd-page]');
      if (!target) return;
      setState({ currentPage: Number(target.getAttribute('data-kd-page')) }, true);
    });

    prevBtn.addEventListener('click', function() {
      if (state.currentPage <= 1) return;
      setState({ currentPage: state.currentPage - 1 }, true);
    });

    nextBtn.addEventListener('click', function() {
      if (state.currentPage >= totalPages()) return;
      setState({ currentPage: state.currentPage + 1 }, true);
    });

    jumpInput.addEventListener('change', function() {
      setState({ currentPage: clamp(jumpInput.value, 1, totalPages()) }, true);
    });

    pageSizeTrigger.addEventListener('click', function() {
      var currentIndex = pageSizeOptions.indexOf(state.pageSize);
      var nextIndex = currentIndex >= 0 ? (currentIndex + 1) % pageSizeOptions.length : 0;
      setState({ pageSize: pageSizeOptions[nextIndex], currentPage: 1 }, true);
    });

    render();

    return {
      render: render,
      setState: function(nextState) {
        setState(nextState, false);
      },
      getState: function() {
        return {
          currentPage: state.currentPage,
          pageSize: state.pageSize,
          total: state.total,
          selectedCount: state.selectedCount,
          totalPages: totalPages()
        };
      },
      destroy: function() {
        container.innerHTML = '';
      }
    };
  }

  global.KdAdminPagination = {
    create: createPagination
  };
})(window);

    var scope = 'partial';

    var listSearch = document.getElementById('listSearch');

    function matchQuery(school, raw) {
      var q = String(raw || '').trim().toLowerCase();
      if (!q) return true;
      return String(school.id).toLowerCase().indexOf(q) !== -1 || school.name.toLowerCase().indexOf(q) !== -1;
    }

    function isAssigned(id) {
      for (var i = 0; i < assigned.length; i += 1) {
        if (assigned[i].id === id) return true;
      }
      return false;
    }

    function filteredAssigned() {
      return assigned.filter(function(s) { return matchQuery(s, listSearch.value); });
    }

    function syncSummary(total, start, count) {
      var el = document.querySelector('#adminPagination [data-kd-pagination-summary]');
      if (!el) return;
      if (!total) {
        el.textContent = '共 0 条';
        return;
      }
      el.textContent = '第 ' + (start + 1) + '-' + (start + count) + ' 条 / 共 ' + total + ' 条';
    }

    function paintRows(rows) {
      if (!rows.length) {
        var emptyText = listSearch.value.trim() ? '未找到匹配的院校' : '暂无公开院校';
        schoolBody.innerHTML = '<tr class="kd-table-row"><td class="kd-table-cell empty-cell" colspan="4">' + emptyText + '</td></tr>';
        return;
      }
      var html = '';

          '<td class="kd-table-cell" title="' + esc(s.id) + '">' + esc(s.id) + '</td>' +

          '</td></tr>';
      });
      schoolBody.innerHTML = html;
    }

    function renderTable(resetPage) {
      if (resetPage) currentPage = 1;
      var rows = filteredAssigned();
      var maxPage = Math.max(1, Math.ceil(rows.length / pageSize) || 1);
      if (currentPage > maxPage) currentPage = maxPage;
      pagination.setState({
        total: rows.length,
        selectedCount: 0,
        currentPage: currentPage,
        pageSize: pageSize
      });
      var st = pagination.getState();
      currentPage = st.currentPage;
      pageSize = st.pageSize;
      var start = rows.length ? (st.currentPage - 1) * st.pageSize : 0;
      var pageRows = rows.slice(start, start + st.pageSize);
      paintRows(pageRows);
      syncSummary(rows.length, start, pageRows.length);
      allSub.textContent = assigned.length
        ? '已配置 ' + assigned.length + ' 所院校，切回「公开到部分」后恢复，无需重新添加。'

    function renderAddTags() {
      var html = '';
      pending.forEach(function(id) {
        var school = null;
        for (var i = 0; i < catalog.length; i += 1) {
          if (catalog[i].id === id) { school = catalog[i]; break; }
        }
        if (!school || isAssigned(id)) return;
        html += '<span class="kd-select-tag" title="' + esc(school.name + ' ' + school.id) + '">' + esc(school.name) +
          '<button type="button" class="kd-select-tag-close" data-remove-id="' + esc(id) + '" aria-label="移除' + esc(school.name) + '">' + uniqSvg(CLOSE_SVG) + '</button></span>';
      });
      addTags.innerHTML = html;
    }

    function syncAddOk() { addOk.disabled = pending.size === 0; }

    function openAdd() {
      pending = new Set();
      addSearch.value = '';
      renderAddTags();
      renderAddOptions();
      syncAddOk();
      addMask.hidden = false;
      addWrap.hidden = false;
      openDropdown();
      addSearch.focus();
    }

    function closeAdd() {
      closeDropdown();
      addMask.hidden = true;
      addWrap.hidden = true;
      pending = new Set();
    }

    function confirmAdd() {
      if (!pending.size) return;
      var now = nowText();
      var ordered = [];
      pending.forEach(function(id) {
        if (isAssigned(id)) return;
        for (var i = 0; i < catalog.length; i += 1) {
          if (catalog[i].id === id) {
            ordered.push({ id: catalog[i].id, name: catalog[i].name, createdAt: now });
            break;
          }
        }
      });
      if (!ordered.length) return;
      for (var n = ordered.length - 1; n >= 0; n -= 1) assigned.unshift(ordered[n]);
      closeAdd();
      listSearch.value = '';
      listSearchClear.hidden = true;
      renderTable(true);
      toast('已新增 ' + ordered.length + ' 所公开院校');
    }

    function askDelete(id) {
      var school = null;
      for (var i = 0; i < assigned.length; i += 1) {
        if (assigned[i].id === id) { school = assigned[i]; break; }
      }
      if (!school) return;
      openConfirm({
        title: '删除公开院校',
        body: '删除后，「' + school.name + '」将不再通过部分公开访问本课程。确定删除？',
        okText: '删除',
        danger: true,
        onOk: function() {
          assigned = assigned.filter(function(s) { return s.id !== id; });
          renderTable(false);
          toast('已删除「' + school.name + '」');
        }
      });
    }

    function closeMain() {
      mainMask.hidden = true;
      mainWrap.hidden = true;
      reopen.hidden = false;
    }

    function openMain() {
      reopen.hidden = true;
      mainMask.hidden = false;
      mainWrap.hidden = false;
      renderScope();
    }

    var pagination = KdAdminPagination.create(document.getElementById('adminPagination'), {
      total: assigned.length,
      selectedCount: 0,
      currentPage: 1,
      pageSize: 20,
      pageSizeOptions: [10, 20, 50],
      onChange: function(state) {
        currentPage = state.currentPage;
        pageSize = state.pageSize;
        renderTable(false);
      }
    });

    renderScope();

    document.querySelector('.kd-segmented-controller').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-scope]');
      if (!btn) return;
      onScopeClick(btn.getAttribute('data-scope'));
    });

    listSearch.addEventListener('input', function() {
      listSearchClear.hidden = !listSearch.value;
      renderTable(true);
    });
    listSearchClear.addEventListener('click', function() {
      listSearch.value = '';
      listSearchClear.hidden = true;
      renderTable(true);
      listSearch.focus();
    });

    schoolBody.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-delete-id]');
      if (!btn) return;
      askDelete(btn.getAttribute('data-delete-id'));
    });

    document.getElementById('openAdd').addEventListener('click', openAdd);
    document.getElementById('addClose').addEventListener('click', closeAdd);
    document.getElementById('addCancel').addEventListener('click', closeAdd);
    addOk.addEventListener('click', confirmAdd);
    addMask.addEventListener('click', closeAdd);

    addSearch.addEventListener('input', renderAddOptions);
    addSearch.addEventListener('focus', openDropdown);
    addTrigger.addEventListener('click', function() {
      addSearch.focus();
      openDropdown();
    });
    addMenu.addEventListener('mousedown', function(e) {
      if (e.target.closest('.add-option')) e.preventDefault();
    });
    addMenu.addEventListener('click', function(e) {
      var row = e.target.closest('[data-school-id]');
      if (!row) return;
      var id = row.getAttribute('data-school-id');
      if (isAssigned(id)) return;
      if (pending.has(id)) pending.delete(id);
      else pending.add(id);
      renderAddOptions();
      renderAddTags();
      syncAddOk();
    });
    addTags.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-remove-id]');
      if (!btn) return;
      e.stopPropagation();
      pending.delete(btn.getAttribute('data-remove-id'));
      renderAddTags();
      renderAddOptions();
      syncAddOk();
    });

    document.addEventListener('mousedown', function(e) {
      if (addWrap.hidden) return;
      if (!addSelect.contains(e.target)) closeDropdown();
    });

    document.getElementById('confirmClose').addEventListener('click', closeConfirm);
    document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
    confirmMask.addEventListener('click', closeConfirm);
    confirmOk.addEventListener('click', function() {
      var action = confirmAction;
      closeConfirm();
      if (action) action();
    });

    document.getElementById('mainClose').addEventListener('click', closeMain);
    mainMask.addEventListener('click', function() {
      if (!addWrap.hidden || !confirmWrap.hidden) return;
      closeMain();
    });
    reopen.addEventListener('click', openMain);

    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      if (!confirmWrap.hidden) { closeConfirm(); return; }
      if (!addWrap.hidden) {
        if (addTrigger.classList.contains('is-open')) { closeDropdown(); return; }
        closeAdd();
        return;
      }
      if (!mainWrap.hidden) closeMain();
    });
  </script>
</body>
</html>
