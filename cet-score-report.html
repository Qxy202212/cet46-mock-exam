<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成绩报告单 · 写作 / 客观题 / 翻译</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            header: "#2B7DE9",
            primary: "#3F80F4",
            page: "#F2F3F5",
            ink: "#333333",
            danger: "#E23C39",
            success: "#389E0D",
            warn: "#E86B3A",
            panel: "#F5F5F5",
            line: "#E8E8E8",
          },
        },
      },
    };
  </script>
  <style>
    html, body { height: 100%; }
    body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .essay { white-space: pre-wrap; word-break: break-word; }
    .q-btn {
      min-width: 64px;
      height: 28px;
      padding: 0 12px;
      border: 1px solid #D0D0D0;
      background: #fff;
      color: #333;
      font-size: 13px;
      line-height: 26px;
    }
    .q-btn.is-on {
      border-color: #2B7DE9;
      background: #2B7DE9;
      color: #fff;
    }
    .pane {
      display: flex;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #E8E8E8;
      background: #fff;
    }
    .pane-hd {
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: #F5F5F5;
      border-bottom: 1px solid #E8E8E8;
      color: #333;
      font-size: 13px;
    }
    .pane-bd {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.75;
      color: #333;
    }
    .score-table, .obj-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .score-table th, .obj-table th {
      font-weight: 400;
      color: #888;
      background: #FAFAFA;
      border-bottom: 1px solid #E8E8E8;
      text-align: left;
      padding: 8px 12px;
    }
    .score-table td, .obj-table td {
      border-bottom: 1px solid #F0F0F0;
      padding: 9px 12px;
      vertical-align: middle;
    }
    .score-table tr.total-row td {
      background: #FAFBFC;
      border-bottom: none;
      font-weight: 500;
    }
    .obj-table tbody tr { cursor: pointer; }
    .obj-table tbody tr:hover td { background: #F7FAFF; }
    .obj-table tbody tr.is-on td { background: #EBF3FF; }
    .opt-line { display: flex; gap: 8px; line-height: 1.7; }
    .opt-key { flex-shrink: 0; width: 22px; color: #666; }
    .passage-box { background: #FAFBFC; border: 1px solid #F0F0F0; }
  </style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-white text-ink">
  <header class="flex h-10 shrink-0 items-center justify-between bg-header px-4 text-white">
    <div class="flex items-center gap-3">
      <a href="cet-score-detail.html" class="grid h-7 w-7 place-items-center rounded hover:bg-white/10" title="返回成绩详情">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 class="text-[15px] font-medium tracking-wide">成绩报告单</h1>
    </div>
    <div class="flex items-center gap-4 text-[12px] text-white/85">
      <a href="cet-index.html" class="hover:text-white">原型入口</a>
      <a href="cet-score-detail.html" class="hover:text-white">成绩详情</a>
    </div>
  </header>

  <section class="flex h-11 shrink-0 items-center border-b border-line bg-[#F7F7F7] px-5 text-[13px]">
    <div class="flex min-w-0 flex-1 items-center gap-8">
      <div><span id="sumMaxLabel">本题总分</span>：<span id="qMax" class="font-medium">15</span> 分</div>
      <div><span id="sumGotLabel">本题得分</span>：<span id="qGot" class="font-medium text-warn">8</span> 分</div>
    </div>
    <div class="mx-6 hidden h-5 w-px bg-[#DDD] md:block"></div>
    <div class="flex min-w-0 flex-1 items-center gap-8">
      <div>卷面满分：<span id="paperMax" class="font-medium">95</span> 分</div>
      <div>考试成绩：<span id="paperGot" class="font-medium text-warn">0</span> 分</div>
    </div>
  </section>

  <nav class="flex h-10 shrink-0 items-center gap-2 border-b border-line bg-white px-5">
    <button type="button" class="q-btn" data-kind="writing">写作</button>
    <button type="button" class="q-btn" data-kind="objective">客观题</button>
    <button type="button" class="q-btn" data-kind="translation">翻译</button>
  </nav>

  <main id="viewSubjective" class="flex min-h-0 flex-1 gap-2 bg-page p-2">
    <section class="flex min-h-0 min-w-0 flex-[62] flex-col gap-2">
      <article class="pane h-[30%]">
        <div class="pane-hd">题干区</div>
        <div id="stemBody" class="pane-bd"></div>
      </article>
      <article class="pane h-[32%]">
        <div class="pane-hd">我的答案</div>
        <div id="answerBody" class="pane-bd essay"></div>
      </article>
      <article class="pane min-h-0 flex-1">
        <div class="pane-hd">解析区</div>
        <div id="analysisBody" class="pane-bd"></div>
      </article>
    </section>
    <aside class="pane min-h-0 w-[38%] shrink-0">
      <div class="pane-hd">得分情况</div>
      <div class="min-h-0 flex-1 overflow-auto">
        <table class="score-table">
          <thead>
            <tr>
              <th class="w-auto">评分要求</th>
              <th class="w-[64px]">分值</th>
              <th class="w-[64px]">得分</th>
              <th class="w-[72px]">结果</th>
            </tr>
          </thead>
          <tbody id="scoreBody"></tbody>
        </table>
      </div>
    </aside>
  </main>

  <main id="viewObjective" class="hidden min-h-0 flex-1 gap-2 bg-page p-2">
    <section class="pane min-h-0 min-w-0 flex-[62]">
      <div class="min-h-0 flex-1 overflow-auto">
        <table class="obj-table">
          <thead>
            <tr>
              <th class="w-[72px]">序号</th>
              <th class="w-[72px]">分值</th>
              <th class="w-[72px]">得分</th>
              <th>标准答案</th>
              <th>你的答案</th>
              <th class="w-[96px]">操作</th>
            </tr>
          </thead>
          <tbody id="objRows"></tbody>
        </table>
      </div>
    </section>
    <aside class="flex min-h-0 w-[38%] shrink-0 flex-col gap-2">
      <article class="pane h-[46%]">
        <div class="pane-hd">题干区</div>
        <div id="objStem" class="pane-bd"></div>
      </article>
      <article class="pane min-h-0 flex-1">
        <div class="pane-hd">解析区</div>
        <div id="objAnalysis" class="pane-bd"></div>
      </article>
    </aside>
  </main>

  <script src="cet-exam-data.js"></script>
  <script>
    (function () {
      var ITEMS = CET_EXAM.buildScoreItems();
      var RUBRICS = CET_EXAM.SUBJECTIVE_RUBRICS;
      var META = CET_EXAM.META;
      var CLOZE_OPTIONS = CET_EXAM.CLOZE_OPTIONS;
      var CLOZE_SEGS = CET_EXAM.CLOZE_SEGS;
      var MATCH_PARAS = CET_EXAM.MATCH_PARAS;
      var CAREFUL_P1 = CET_EXAM.CAREFUL_P1;
      var CAREFUL_P2 = CET_EXAM.CAREFUL_P2;
      var OBJ_ITEMS = ITEMS.filter(function (it) {
        return it.kind !== "writing" && it.kind !== "translation";
      });
      var currentKind = "writing";
      var activeObjId = OBJ_ITEMS[0] ? OBJ_ITEMS[0].id : "";

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function findItem(kind) {
        for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].kind === kind) return ITEMS[i];
        return ITEMS[0];
      }

      function findObj(id) {
        for (var i = 0; i < OBJ_ITEMS.length; i++) if (OBJ_ITEMS[i].id === id) return OBJ_ITEMS[i];
        return OBJ_ITEMS[0];
      }

      function paperScore() {
        var got = 0;
        ITEMS.forEach(function (it) { got += it.got; });
        return { got: got, max: META.maxScore };
      }

      function objScore() {
        var got = 0, max = 0;
        OBJ_ITEMS.forEach(function (it) { got += it.got; max += it.max; });
        return { got: got, max: max };
      }

      function resultMeta(got, max) {
        if (got >= max) return { label: "达标", cls: "text-success" };
        if (got <= 0) return { label: "未达", cls: "text-danger" };
        return { label: "部分", cls: "text-warn" };
      }

      function scoreCls(got, max) {
        if (got >= max) return "text-success";
        if (got <= 0) return "text-danger";
        return "text-warn";
      }

      function kindFromHash() {
        var h = (location.hash || "").replace("#", "");
        if (h === "translation" || h === "objective") return h;
        return "writing";
      }

      function displayNo(it) {
        if (it.listenNo != null) return String(it.listenNo);
        if (it.blankNo != null) return String(it.blankNo);
        if (it.matchNo != null) return String(it.matchNo);
        if (it.readingNo != null) return String(it.readingNo);
        return String(it.no);
      }

      function wordByKey(key) {
        for (var i = 0; i < CLOZE_OPTIONS.length; i++) {
          if (CLOZE_OPTIONS[i].key === key) return CLOZE_OPTIONS[i].word;
        }
        return key;
      }

      function optionLines(options) {
        return (options || []).map(function (o) {
          return '<div class="opt-line"><span class="opt-key">' + esc(o.key) + '.</span><span>' + esc(o.text) + "</span></div>";
        }).join("");
      }

      function renderPassageHtml(highlightNo) {
        return CLOZE_SEGS.map(function (seg) {
          if (seg.type !== "blank") return esc(seg.text);
          var on = seg.no === highlightNo;
          return '<span class="inline-block min-w-[42px] border-b border-[#333] px-1 text-center font-semibold ' +
            (on ? "bg-[#EBF3FF] text-primary" : "text-[#666]") + '">' + seg.no + "</span>";
        }).join("");
      }

      function renderStem(it) {
        var html = '<div class="mb-2 text-[#666]">' + esc(it.stem) + "</div>";
        if (it.kind === "writing") {
          html += '<div class="mt-3 border border-line bg-[#FAFBFC] px-3 py-3 leading-7">' + esc(it.material) + "</div>";
        } else {
          html += '<div class="mt-3 border border-line bg-[#FAFBFC] px-3 py-3 leading-7">' + esc(it.source) + "</div>";
        }
        document.getElementById("stemBody").innerHTML = html;
      }

      function renderAnswer(it) {
        document.getElementById("answerBody").textContent = it.mine || "未作答";
      }

      function renderAnalysis(it, rubric) {
        var html = "";
        html += '<div class="mb-1 font-medium">提示</div><ul class="mb-4 list-disc pl-5 text-[#555]">';
        rubric.tips.forEach(function (t) { html += "<li>" + esc(t) + "</li>"; });
        html += "</ul>";
        html += '<div class="mb-1 font-medium">' + (it.kind === "writing" ? "【参考范文】" : "【参考译文】") + "</div>";
        html += '<div class="essay mb-4 px-1">' + esc(it.correct) + "</div>";
        html += '<div class="mb-1 font-medium">【解析】</div>';
        html += '<div class="mb-4 text-[#555]">' + esc(it.analysis) + "</div>";
        html += '<div class="mb-1 font-medium">【解题步骤】</div><ol class="list-decimal pl-5 text-[#555]">';
        rubric.steps.forEach(function (s) { html += "<li class='mb-1'>" + esc(s) + "</li>"; });
        html += "</ol>";
        document.getElementById("analysisBody").innerHTML = html;
      }

      function renderScore(it, rubric) {
        var rows = "";
        rubric.dims.forEach(function (d) {
          var rs = resultMeta(d.got, d.max);
          rows +=
            "<tr>" +
              "<td>" + esc(d.name) + "</td>" +
              '<td class="text-danger">' + d.max + "</td>" +
              '<td class="' + scoreCls(d.got, d.max) + ' font-medium">' + d.got + "</td>" +
              '<td class="' + rs.cls + '">' + rs.label + "</td>" +
            "</tr>";
        });
        var totalRs = resultMeta(it.got, it.max);
        rows +=
          '<tr class="total-row">' +
            "<td>总分</td>" +
            '<td class="text-danger">' + it.max + "</td>" +
            '<td class="' + scoreCls(it.got, it.max) + ' font-medium">' + it.got + "</td>" +
            '<td class="' + totalRs.cls + '">' + totalRs.label + "</td>" +
          "</tr>";
        document.getElementById("scoreBody").innerHTML = rows;
      }

      function renderObjTable() {
        document.getElementById("objRows").innerHTML = OBJ_ITEMS.map(function (it) {
          var wrong = it.got < it.max;
          var mine = it.mine ? String(it.mine) : "未作答";
          var on = it.id === activeObjId ? " is-on" : "";
          return (
            '<tr class="' + on + '" data-id="' + esc(it.id) + '">' +
              "<td>" + esc(displayNo(it)) + "</td>" +
              "<td>" + it.max + "</td>" +
              '<td class="' + (wrong ? "text-danger" : "text-success") + ' font-medium">' + it.got + "</td>" +
              "<td>" + esc(it.correct) + "</td>" +
              '<td class="' + (wrong ? "text-danger" : "") + '">' + esc(mine) + "</td>" +
              '<td><a class="text-primary hover:underline" href="#" data-feedback="' + esc(it.id) + '">题目反馈</a></td>' +
            "</tr>"
          );
        }).join("");
      }

      function renderObjStem(it) {
        var html = "";
        if (it.kind === "listening") {
          if (it.material) html += '<div class="mb-2 text-[#888]">' + esc(it.material) + "</div>";
          html += "<div>" + esc(it.stem) + "</div>" + optionLines(it.options);
        } else if (it.kind === "banked_cloze") {
          html += '<div class="passage-box mb-3 px-3 py-3">' + renderPassageHtml(it.blankNo) + "</div>";
          html += "<div class='mb-2'>" + esc(it.stem) + "</div>" + optionLines(it.options);
        } else if (it.kind === "matching") {
          html += '<div class="passage-box mb-3 max-h-[180px] overflow-auto px-3 py-3">';
          html += MATCH_PARAS.map(function (p) {
            return '<div class="mb-2 last:mb-0"><span class="font-medium">' + esc(p.key) + ".</span> " + esc(p.text) + "</div>";
          }).join("");
          html += "</div><div>" + esc(it.stem) + "</div>";
        } else if (it.kind === "careful_reading") {
          var passage = (it.readingNo != null && it.readingNo >= 51) ? CAREFUL_P2 : CAREFUL_P1;
          html += '<div class="passage-box essay mb-3 max-h-[180px] overflow-auto px-3 py-3">' + esc(passage) + "</div>";
          html += "<div class='mb-2'>" + esc(it.stem) + "</div>" + optionLines(it.options);
        } else {
          html += "<div>" + esc(it.stem) + "</div>";
        }
        document.getElementById("objStem").innerHTML = html;
      }

      function renderObjAnalysis(it) {
        var html = "";
        html += '<div class="mb-1 font-medium">提示</div>';
        html += '<ul class="mb-4 list-disc pl-5 text-[#555]"><li>本题为客观题，对则满分，错或未答为 0，无部分分。</li>';
        html += "<li>题型：" + esc(it.type) + "。</li></ul>";
        html += '<div class="mb-1 font-medium">【标准答案】</div>';
        if (it.kind === "banked_cloze") {
          html += '<div class="mb-4">' + esc(it.correct) + "（" + esc(wordByKey(it.correct)) + "）</div>";
        } else {
          html += '<div class="mb-4">' + esc(it.correct) + "</div>";
        }
        html += '<div class="mb-1 font-medium">【解析】</div>';
        html += '<div class="text-[#555]">' + esc(it.analysis) + "</div>";
        document.getElementById("objAnalysis").innerHTML = html;
      }

      function renderTabs() {
        var btns = document.querySelectorAll(".q-btn");
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.toggle("is-on", btns[i].getAttribute("data-kind") === currentKind);
        }
      }

      function renderSummary() {
        var paper = paperScore();
        document.getElementById("paperMax").textContent = paper.max;
        document.getElementById("paperGot").textContent = paper.got;
        if (currentKind === "objective") {
          var os = objScore();
          document.getElementById("sumMaxLabel").textContent = "客观题总分";
          document.getElementById("sumGotLabel").textContent = "客观题得分";
          document.getElementById("qMax").textContent = os.max;
          document.getElementById("qGot").textContent = os.got;
        } else {
          var it = findItem(currentKind);
          document.getElementById("sumMaxLabel").textContent = "本题总分";
          document.getElementById("sumGotLabel").textContent = "本题得分";
          document.getElementById("qMax").textContent = it.max;
          document.getElementById("qGot").textContent = it.got;
        }
      }

      function render() {
        renderTabs();
        renderSummary();
        var sub = document.getElementById("viewSubjective");
        var obj = document.getElementById("viewObjective");
        if (currentKind === "objective") {
          sub.classList.add("hidden");
          obj.classList.remove("hidden");
          obj.classList.add("flex");
          renderObjTable();
          var cur = findObj(activeObjId);
          if (cur) {
            renderObjStem(cur);
            renderObjAnalysis(cur);
          }
        } else {
          obj.classList.add("hidden");
          obj.classList.remove("flex");
          sub.classList.remove("hidden");
          var it = findItem(currentKind);
          renderStem(it);
          renderAnswer(it);
          renderAnalysis(it, RUBRICS[currentKind]);
          renderScore(it, RUBRICS[currentKind]);
        }
      }

      function setKind(kind) {
        if (kind !== "writing" && kind !== "translation" && kind !== "objective") kind = "writing";
        currentKind = kind;
        if (location.hash.replace("#", "") !== currentKind) {
          history.replaceState(null, "", "#" + currentKind);
        }
        render();
      }

      document.querySelector("nav").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-kind]");
        if (btn) setKind(btn.getAttribute("data-kind"));
      });

      document.getElementById("objRows").addEventListener("click", function (e) {
        var link = e.target.closest("[data-feedback]");
        if (link) e.preventDefault();
        var row = e.target.closest("[data-id]");
        if (!row) return;
        activeObjId = row.getAttribute("data-id");
        renderObjTable();
        var cur = findObj(activeObjId);
        renderObjStem(cur);
        renderObjAnalysis(cur);
      });

      window.addEventListener("hashchange", function () {
        setKind(kindFromHash());
      });

      setKind(kindFromHash());
    })();
  </script>
</body>
</html>
