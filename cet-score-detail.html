<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成绩详情 · 2026年英语四级考试真题一</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#3F80F4",
            page: "#F2F3F5",
            ink: "#333333",
            danger: "#F54A45",
            warn: "#E86B3A",
          },
          boxShadow: {
            card: "0 1px 4px rgba(0,0,0,.06)",
            drawer: "-4px 0 24px rgba(0,0,0,.08)",
          },
        },
      },
    };
  </script>
  <style>
    html, body { height: 100%; }
    body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .gauge-progress { transform: rotate(-90deg); transform-origin: 50% 50%; }
    .row-active td { background: #F5F9FF; }
    .sec-bar { width: 4px; height: 14px; border-radius: 1px; background: #3F80F4; }
    .drawer-enter { animation: slideIn .22s ease; }
    @keyframes slideIn {
      from { transform: translateX(24px); opacity: .6; }
      to { transform: translateX(0); opacity: 1; }
    }
    .opt-line { display: flex; gap: 8px; line-height: 1.7; }
    .opt-key { flex-shrink: 0; width: 22px; color: #666; }
    .passage-box { background: #FAFBFC; border: 1px solid #F0F0F0; border-radius: 8px; }
    .essay-box { white-space: pre-wrap; line-height: 1.85; }
  </style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-page text-ink">
  <header class="flex h-14 shrink-0 items-center justify-between bg-white px-5 shadow-[0_1px_0_#EEE]">
    <div class="flex items-center gap-2">
      <a href="cet-index.html" class="grid h-8 w-8 place-items-center rounded hover:bg-gray-50" title="返回入口">
        <svg class="h-5 w-5 text-[#666]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 class="text-[16px] font-medium">成绩详情</h1>
    </div>
    <div class="flex items-center gap-4">
      <a href="wps-exam-ai-weekly-v2.html" class="text-[13px] text-[#888] hover:text-primary">测验作答</a>
      <a href="cet-exam-system.html" class="text-[13px] text-[#888] hover:text-primary">考试作答</a>
      <a href="cet-paper-preview.html" class="text-[13px] text-primary hover:underline">试卷详情</a>
      <div class="text-[12px] text-[#B0B0B0]">创建时间：2026-08-21 15:01:30</div>
    </div>
  </header>

  <main class="min-h-0 flex-1 overflow-auto p-5">
    <div class="mx-auto max-w-[1280px]">
      <section class="flex gap-4">
        <article class="flex h-[220px] w-[320px] shrink-0 flex-col rounded-lg bg-white px-6 py-5 shadow-card">
          <div class="text-[13px] text-[#888]">全题型试卷满分<span id="metaMax">95</span></div>
          <div class="flex min-h-0 flex-1 items-center justify-center">
            <div class="relative h-[148px] w-[148px]">
              <svg viewBox="0 0 148 148" class="h-full w-full">
                <circle cx="74" cy="74" r="58" fill="none" stroke="#EDEDED" stroke-width="14"/>
                <circle id="gaugeArc" class="gauge-progress" cx="74" cy="74" r="58" fill="none" stroke="#3F80F4" stroke-width="14" stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="364.4"/>
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <div id="totalGot" class="text-[32px] font-semibold leading-none">0</div>
                <div id="totalMax" class="mt-1.5 text-[12px] text-[#999]">总分95</div>
              </div>
            </div>
          </div>
        </article>

        <div id="sectionCards" class="grid min-h-[220px] flex-1 grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6"></div>
      </section>

      <section class="mt-4 rounded-lg bg-white shadow-card">
        <div class="border-b border-[#F0F0F0] px-6 py-4 text-[16px] font-medium">得分详情</div>
        <table class="w-full text-[13px]">
          <thead>
            <tr class="border-b border-[#F0F0F0] text-left text-[#888]">
              <th class="w-[88px] px-6 py-3 font-normal">题号</th>
              <th class="px-4 py-3 font-normal">题目</th>
              <th class="w-[100px] px-4 py-3 font-normal">分值</th>
              <th class="w-[100px] px-4 py-3 font-normal">得分</th>
              <th class="w-[160px] px-6 py-3 font-normal">正确答案</th>
            </tr>
          </thead>
          <tbody id="scoreRows"></tbody>
        </table>
      </section>
    </div>
  </main>

  <aside id="drawer" class="drawer-enter fixed inset-y-0 right-0 z-30 hidden w-[480px] flex-col bg-white shadow-drawer">
    <div class="flex h-14 shrink-0 items-center justify-between border-b border-[#F0F0F0] px-5">
      <div id="drawerTitle" class="text-[16px] font-medium">题目详情</div>
      <button id="closeDrawer" type="button" class="grid h-8 w-8 place-items-center rounded text-[#999] hover:bg-gray-50 hover:text-[#666]">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="drawerBody" class="min-h-0 flex-1 overflow-auto px-6 py-5"></div>
  </aside>

  <script src="cet-exam-data.js"></script>
  <script>
    (function () {
      var META = CET_EXAM.META;
      var CLOZE_OPTIONS = CET_EXAM.CLOZE_OPTIONS.map(function (o) { return { key: o.key, text: o.word }; });
      var CLOZE_PASSAGE = CET_EXAM.CLOZE_SEGS;
      var MATCH_PARAS = CET_EXAM.MATCH_PARAS;
      var CAREFUL_P1 = CET_EXAM.CAREFUL_P1;
      var CAREFUL_P2 = CET_EXAM.CAREFUL_P2;
      var ITEMS = CET_EXAM.buildScoreItems();

      var TYPE_CARDS = [
        { label: "写作", kinds: ["writing"] },
        { label: "听力", kinds: ["listening"] },
        { label: "选词填空", kinds: ["banked_cloze"] },
        { label: "信息匹配", kinds: ["matching"] },
        { label: "仔细阅读", kinds: ["careful_reading"] },
        { label: "翻译", kinds: ["translation"] }
      ];

      var activeId = "r47";

      function displayNo(it) {
        if (it.kind === "writing") return "写作";
        if (it.kind === "translation") return "翻译";
        if (it.blankNo != null) return String(it.blankNo);
        if (it.matchNo != null) return String(it.matchNo);
        if (it.readingNo != null) return String(it.readingNo);
        if (it.listenNo != null) return String(it.listenNo);
        return String(it.no);
      }

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function findItem(id) {
        for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i];
        return ITEMS[0];
      }

      function typeScore(kinds) {
        var set = {};
        kinds.forEach(function (k) { set[k] = true; });
        var got = 0, max = 0;
        ITEMS.forEach(function (it) {
          if (set[it.kind]) { got += it.got; max += it.max; }
        });
        return { got: got, max: max };
      }

      function totalScore() {
        var got = 0, max = 0;
        ITEMS.forEach(function (it) { got += it.got; max += it.max; });
        return { got: got, max: max };
      }

      function wordByKey(key) {
        for (var i = 0; i < CLOZE_OPTIONS.length; i++) {
          if (CLOZE_OPTIONS[i].key === key) return CLOZE_OPTIONS[i].text;
        }
        return key;
      }

      function paraByKey(key) {
        for (var i = 0; i < MATCH_PARAS.length; i++) {
          if (MATCH_PARAS[i].key === key) return MATCH_PARAS[i];
        }
        return null;
      }

      function optionLines(options) {
        return (options || []).map(function (o) {
          return '<div class="opt-line"><span class="opt-key">' + esc(o.key) + '.</span><span>' + esc(o.text) + "</span></div>";
        }).join("");
      }

      function secTitle(text) {
        return '<div class="mb-2 mt-5 flex items-center gap-2 first:mt-0"><i class="sec-bar"></i><span class="text-[14px] font-medium">' + esc(text) + "</span></div>";
      }

      function renderPassageHtml(highlightNo) {
        return CLOZE_PASSAGE.map(function (seg) {
          if (seg.type !== "blank") return esc(seg.text);
          var on = seg.no === highlightNo;
          return '<span class="inline-block min-w-[42px] border-b border-[#333] px-1 text-center font-semibold ' + (on ? "bg-[#EBF3FF] text-primary" : "text-[#666]") + '">' + seg.no + "</span>";
        }).join("");
      }

      function renderCards() {
        var html = TYPE_CARDS.map(function (s) {
          var sc = typeScore(s.kinds);
          var weak = sc.max > 0 && sc.got / sc.max < 0.6;
          return (
            '<article class="flex flex-col rounded-lg bg-white px-4 py-5 shadow-card">' +
              '<div class="text-[13px] text-[#888]">' + esc(s.label) + "</div>" +
              '<div class="mt-5 text-[22px] font-medium leading-none">' + sc.got + "<span class=\"text-[14px] font-normal\">分</span></div>" +
              '<div class="mt-2 text-[12px] text-[#999]">总分' + sc.max + "</div>" +
              (weak ? '<div class="mt-4"><span class="rounded px-2 py-0.5 text-[12px] text-warn" style="background:#FFF1EA">待提升</span></div>' : '<div class="mt-4 h-[22px]"></div>') +
            "</article>"
          );
        }).join("");
        document.getElementById("sectionCards").innerHTML = html;
      }

      function renderGauge() {
        var t = totalScore();
        var c = 2 * Math.PI * 58;
        var offset = c * (1 - (t.max ? t.got / t.max : 0));
        var arc = document.getElementById("gaugeArc");
        arc.setAttribute("stroke-dasharray", c.toFixed(2));
        arc.setAttribute("stroke-dashoffset", offset.toFixed(2));
        document.getElementById("totalGot").textContent = t.got;
        document.getElementById("totalMax").textContent = "总分" + t.max;
      }

      function answerCell(it) {
        if (it.kind === "writing" || it.kind === "translation") {
          return '<a class="text-primary hover:underline" href="cet-score-report.html#' + it.kind + '">查看详情</a>';
        }
        return esc(it.correct);
      }

      function renderTable() {
        document.getElementById("scoreRows").innerHTML = ITEMS.map(function (it) {
          var low = it.got < it.max;
          var active = it.id === activeId ? " row-active" : "";
          return (
            '<tr class="cursor-pointer border-b border-[#F5F5F5] last:border-0 hover:bg-[#FAFBFC]' + active + '" data-open="' + it.id + '">' +
              '<td class="px-6 py-3.5 text-[#666]">' + esc(displayNo(it)) + "</td>" +
              '<td class="px-4 py-3.5">' + esc(it.type) + "</td>" +
              '<td class="px-4 py-3.5">' + it.max + "</td>" +
              '<td class="px-4 py-3.5 ' + (low ? "text-danger" : "") + '">' + it.got + "</td>" +
              '<td class="px-6 py-3.5">' + answerCell(it) + "</td>" +
            "</tr>"
          );
        }).join("");
      }

      function renderDrawer(it) {
        document.getElementById("drawerTitle").textContent = it.type;
        var html = "";

        html += secTitle("题目内容");
        if (it.kind === "listening") {
          html += '<div class="text-[13px] leading-7 text-[#333]"><div class="mb-2">' + esc(it.stem) + "</div>" + optionLines(it.options) + "</div>";
        } else if (it.kind === "banked_cloze") {
          var clozeStem = String(it.stem || "").replace(/^\d+\.\s*/, "");
          html += '<div class="passage-box mb-3 px-3 py-3 text-[13px] leading-7">' + renderPassageHtml(it.blankNo) + "</div>";
          html += '<div class="text-[13px] leading-7"><div class="mb-2">' + esc(clozeStem) + "</div>" + optionLines(it.options) + "</div>";
        } else if (it.kind === "matching") {
          html += '<div class="text-[13px] leading-7 text-[#333]">';
          html += '<div class="mb-3">' + esc("Directions: In this section, you are going to read a passage with ten statements attached to it. Each statement contains information given in one of the paragraphs. Identify the paragraph from which the information is derived. You may choose a paragraph more than once. Each paragraph is marked with a letter.") + "</div>";
          html += '<div class="passage-box mb-3 max-h-[240px] overflow-auto px-3 py-3">';
          html += MATCH_PARAS.map(function (p) {
            return '<div class="mb-2 last:mb-0"><span class="font-medium">' + esc(p.key) + ".</span> " + esc(p.text) + "</div>";
          }).join("");
          html += "</div>";
          html += '<div class="border-t border-[#EEE] pt-3">' + esc(it.stem) + "</div>";
          html += "</div>";
        } else if (it.kind === "careful_reading") {
          var passage = (it.readingNo != null && it.readingNo >= 51) ? CAREFUL_P2 : CAREFUL_P1;
          html += '<div class="passage-box mb-3 px-3 py-3 text-[13px] leading-7 essay-box">' + esc(passage) + "</div>";
          html += '<div class="text-[13px] leading-7"><div class="mb-2">' + esc(it.stem) + "</div>" + optionLines(it.options) + "</div>";
        } else if (it.kind === "translation") {
          html += '<div class="text-[13px] leading-7">' + esc(it.stem) + "</div>";
          html += '<div class="passage-box mt-2 px-3 py-3 text-[13px] leading-7">' + esc(it.source) + "</div>";
        } else if (it.kind === "writing") {
          html += '<div class="text-[13px] leading-7">' + esc(it.stem) + "</div>";
          html += '<div class="passage-box mt-2 px-3 py-3 text-[13px] leading-7">' + esc(it.material) + "</div>";
        }

        html += secTitle("我的答案");
        if (it.kind === "writing" || it.kind === "translation") {
          html += '<div class="essay-box text-[13px] text-[#333]">' + esc(it.mine) + "</div>";
        } else if (it.kind === "banked_cloze") {
          html += '<div class="text-[13px]">' + esc(it.mine) + "（" + esc(wordByKey(it.mine)) + "）</div>";
        } else {
          html += '<div class="text-[13px]">' + esc(it.mine) + "</div>";
        }

        html += secTitle("标准答案");
        if (it.kind === "writing" || it.kind === "translation") {
          html += '<div class="essay-box text-[13px] text-[#333]">' + esc(it.correct) + "</div>";
        } else if (it.kind === "banked_cloze") {
          html += '<div class="text-[13px]">' + esc(it.correct) + "（" + esc(wordByKey(it.correct)) + "）</div>";
        } else if (it.kind === "matching") {
          html += '<div class="text-[13px]">' + esc(it.correct) + "</div>";
        } else {
          html += '<div class="text-[13px]">' + esc(it.correct) + "</div>";
        }

        html += secTitle("解析");
        html += '<div class="pb-4 text-[13px] leading-7 text-[#555]">' + esc(it.analysis) + "</div>";

        document.getElementById("drawerBody").innerHTML = html;
        document.getElementById("drawer").classList.remove("hidden");
        document.getElementById("drawer").classList.add("flex");
      }

      function openItem(id) {
        activeId = id;
        renderTable();
        renderDrawer(findItem(id));
      }

      function closeDrawer() {
        document.getElementById("drawer").classList.add("hidden");
        document.getElementById("drawer").classList.remove("flex");
        activeId = null;
        renderTable();
      }

      document.getElementById("scoreRows").addEventListener("click", function (e) {
        if (e.target.closest("a")) return;
        var row = e.target.closest("[data-open]");
        if (!row) return;
        openItem(row.getAttribute("data-open"));
      });
      document.getElementById("closeDrawer").onclick = closeDrawer;

      renderGauge();
      renderCards();
      renderTable();
      document.getElementById("metaMax").textContent = META.maxScore;
      openItem(activeId);
    })();
  </script>
</body>
</html>
