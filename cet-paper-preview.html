<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>试卷详情 · 2026年英语四级考试真题一</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#3F80F4",
            page: "#F2F3F5",
            ink: "#333333",
          },
          boxShadow: {
            card: "0 1px 4px rgba(0,0,0,.06)",
            modal: "0 12px 40px rgba(0,0,0,.16)",
          },
        },
      },
    };
  </script>
  <style>
    html, body { height: 100%; }
    body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .paper-scroll::-webkit-scrollbar,
    .struct-scroll::-webkit-scrollbar { width: 8px; }
    .paper-scroll::-webkit-scrollbar-thumb,
    .struct-scroll::-webkit-scrollbar-thumb { background: #D8D8D8; border-radius: 4px; }
    .nav-num {
      display: grid; place-items: center; width: 36px; height: 36px;
      border: 1px solid #E6E6E6; border-radius: 4px; background: #fff;
      font-size: 13px; color: #333; cursor: pointer;
    }
    .nav-num:hover { border-color: #3F80F4; color: #3F80F4; }
    .nav-num.is-on { border-color: #3F80F4; background: #F5F9FF; color: #3F80F4; }
    .paper-sheet { position: relative; }
    .paper-watermark {
      position: absolute; inset: 0; z-index: 0; overflow: hidden;
      pointer-events: none; user-select: none;
    }
    .paper-watermark span {
      display: inline-block; margin: 42px 28px; color: rgba(51,51,51,.07);
      font-size: 15px; letter-spacing: .04em; transform: rotate(-22deg); white-space: nowrap;
    }
    .paper-inner { position: relative; z-index: 1; }
    .part-h { margin: 40px 0 12px; font-size: 16px; font-weight: 700; color: #222; }
    .part-h:first-child { margin-top: 0; }
    .sec-h { margin: 28px 0 10px; font-size: 15px; font-weight: 700; color: #222; }
    .dir { margin: 0 0 16px; font-size: 14px; line-height: 1.9; color: #555; }
    .q-block, .blank-no { scroll-margin-top: 20px; }
    .q-block {
      margin: 0 0 8px;
      padding: 8px 4px 4px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
    }
    .q-block:hover, .q-block.is-on {
      margin: 0 -8px 12px;
      padding: 16px 20px 12px;
      border-color: #E8E8E8;
      background: #fff;
    }
    .q-stem { font-size: 15px; line-height: 1.9; color: #222; }
    .q-opt { margin-top: 4px; padding-left: 22px; font-size: 14px; line-height: 1.85; color: #333; }
    .q-foot {
      display: none;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 13px;
      color: #999;
    }
    .q-block:hover .q-foot, .q-block.is-on .q-foot { display: flex; }
    .q-foot-div { margin: 0 8px; color: #D0D0D0; }
    .q-detail { color: #3F80F4; background: none; border: 0; padding: 0; cursor: pointer; }
    .q-detail:hover { text-decoration: underline; }
    .blank-no {
      display: inline-block; min-width: 48px; margin: 0 3px; padding: 0 4px;
      border-bottom: 1px solid #333; text-align: center; font-weight: 600; color: #333; cursor: pointer;
    }
    .blank-no:hover, .blank-no.is-on { background: #EBF3FF; color: #3F80F4; border-color: #3F80F4; }
    .detail-mask { background: rgba(0,0,0,.28); }
    .detail-modal { width: min(960px, calc(100vw - 48px)); max-height: min(720px, calc(100vh - 64px)); }
    .detail-h { font-size: 15px; font-weight: 600; color: #222; margin: 22px 0 8px; }
    .detail-h:first-child { margin-top: 0; }
    .sub-pill {
      min-width: 32px; height: 28px; padding: 0 8px; border: 1px solid #D9D9D9;
      border-radius: 14px; background: #fff; color: #333; font-size: 12px;
    }
    .sub-pill.is-on { border-color: #3F80F4; background: #3F80F4; color: #fff; }
    .parent-box { background: #FAFBFC; border: 1px solid #F0F0F0; border-radius: 8px; }
    .progress-track { height: 4px; background: #E6E6E6; border-radius: 999px; }
    .progress-fill { height: 4px; width: 0; background: #3F80F4; border-radius: 999px; }
    button.listen-file[type="button"] {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; margin: 2px 8px 0 0; padding: 0;
      border: 0; border-radius: 3px;
      background-color: #3F80F4; color: #fff; cursor: pointer; flex-shrink: 0;
    }
    button.listen-file[type="button"] svg {
      width: 10px; height: 10px; display: block; fill: currentColor;
    }
    button.listen-file[type="button"] .ico-pause { display: none; }
    button.listen-file[type="button"].is-on .ico-play { display: none; }
    button.listen-file[type="button"].is-on .ico-pause { display: block; }
    .listen-file-tip {
      display: none; position: absolute; left: 50%; bottom: calc(100% + 6px);
      transform: translateX(-50%); padding: 4px 8px; border-radius: 4px;
      background: #333; color: #fff; font-size: 12px; font-weight: 400;
      line-height: 1.4; white-space: nowrap; z-index: 8; pointer-events: none;
    }
    .listen-file:hover .listen-file-tip { display: block; }
  </style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-page text-ink">
  <header class="flex h-12 shrink-0 items-center bg-white px-5 shadow-[0_1px_0_#EEE]">
    <a href="cet-index.html" class="grid h-8 w-8 place-items-center rounded hover:bg-gray-50" title="返回">
      <svg class="h-5 w-5 text-[#666]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 class="text-[16px] font-medium">试卷详情</h1>
  </header>

  <main class="flex min-h-0 flex-1 gap-4 p-4">
    <section id="paperScroll" class="paper-scroll paper-sheet min-w-0 flex-1 overflow-auto rounded-lg bg-white shadow-card">
      <div id="watermark" class="paper-watermark" aria-hidden="true"></div>
      <div class="paper-inner px-16 py-12">
        <h2 id="paperTitle" class="text-center text-[22px] font-bold leading-snug">2026年英语四级考试真题一</h2>
        <p id="paperMeta" class="mt-3 text-center text-[13px] text-[#999]">总分: 95&nbsp;&nbsp;&nbsp;题数: 57&nbsp;&nbsp;&nbsp;及格分: 57</p>
        <div id="paperBody" class="mt-12"></div>
      </div>
    </section>

    <aside class="struct-scroll flex w-[300px] shrink-0 flex-col overflow-auto rounded-lg bg-white px-5 py-5 shadow-card">
      <div class="mb-4 flex items-center gap-1.5">
        <span class="text-[15px] font-medium">试卷结构</span>
        <span class="grid h-4 w-4 place-items-center rounded-full border border-[#D0D0D0] text-[10px] leading-none text-[#999]" title="点击题号可跳转到对应题目">i</span>
      </div>
      <div id="structNav"></div>
    </aside>
  </main>

  <div id="detailMask" class="detail-mask fixed inset-0 z-40 hidden items-center justify-center p-6">
    <div id="detailModal" class="detail-modal flex flex-col overflow-hidden rounded-lg bg-white shadow-modal" role="dialog" aria-labelledby="detailTitle">
      <div class="flex h-14 shrink-0 items-center justify-between border-b border-[#F0F0F0] px-6">
        <div id="detailTitle" class="text-[16px] font-medium">题目详情</div>
        <button id="closeDetail" type="button" class="grid h-8 w-8 place-items-center rounded text-[#999] hover:bg-gray-50 hover:text-[#666]" aria-label="关闭">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="flex min-h-0 flex-1">
        <div id="detailMain" class="min-w-0 flex-1 overflow-auto px-7 py-6"></div>
        <aside id="detailSide" class="w-[220px] shrink-0 overflow-auto border-l border-[#F0F0F0] bg-[#F7F8FA] px-5 py-6"></aside>
      </div>
    </div>
  </div>

  <script src="cet-exam-data.js"></script>
  <script>
    (function () {
      var META = CET_EXAM.META;
      var CLOZE_BANK = CET_EXAM.CLOZE_OPTIONS;
      var CLOZE_SEGS = CET_EXAM.CLOZE_SEGS;
      var MATCH_PARAS = CET_EXAM.MATCH_PARAS;
      var CAREFUL_P1 = CET_EXAM.CAREFUL_P1;
      var CAREFUL_P2 = CET_EXAM.CAREFUL_P2;
      var ITEMS = CET_EXAM.buildPreviewItems();
      var SCORE_ITEMS = CET_EXAM.buildScoreItems();

      document.getElementById("paperTitle").textContent = META.title;
      document.getElementById("paperMeta").innerHTML =
        "总分: " + META.maxScore + "&nbsp;&nbsp;&nbsp;题数: " + META.totalItems + "&nbsp;&nbsp;&nbsp;及格分: " + META.passScore;

      var wm = "";
      for (var i = 0; i < 80; i++) wm += "<span>邱老师/7701</span>";
      document.getElementById("watermark").innerHTML = wm;

      var GROUPS = [
        { key: "writing", title: "写作" },
        { key: "listening", title: "听力理解" },
        { key: "cloze", title: "选词填空" },
        { key: "matching", title: "信息匹配" },
        { key: "careful", title: "仔细阅读" },
        { key: "translation", title: "翻译" }
      ];

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function itemsOf(key) {
        return ITEMS.filter(function (it) { return it.group === key; });
      }

      function groupMeta(key) {
        var list = itemsOf(key);
        var score = 0;
        list.forEach(function (it) { score += it.score; });
        return { count: list.length, score: score };
      }

      function findItem(no) {
        for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].no === no) return ITEMS[i];
        return ITEMS[0];
      }

      function displayNo(it) {
        if (it.kind === "writing") return "写";
        if (it.kind === "translation") return "译";
        if (it.blankNo != null) return String(it.blankNo);
        if (it.matchNo != null) return String(it.matchNo);
        if (it.readingNo != null) return String(it.readingNo);
        if (it.listenNo != null) return String(it.listenNo);
        return String(it.no);
      }

      function typeOf(it) {
        if (it.kind === "writing") return "写作题";
        if (it.kind === "listening") return "听力题";
        if (it.kind === "cloze") return "选词填空";
        if (it.kind === "matching") return "信息匹配";
        if (it.kind === "careful") return "仔细阅读";
        if (it.kind === "translation") return "翻译题";
        return it.label || "题目";
      }

      function difficultyOf(it) {
        if (it.kind === "writing" || it.kind === "translation" || it.kind === "careful") return "较难";
        if (it.kind === "listening") return "简单";
        return "中等";
      }

      function knowledgeOf(it) {
        if (it.kind === "writing") return "写作 · 校园场景";
        if (it.kind === "listening") return "听力理解 · Section " + (it.listenSection || "");
        if (it.kind === "cloze") return "阅读理解 · 选词填空";
        if (it.kind === "matching") return "阅读理解 · 信息匹配";
        if (it.kind === "careful") return "阅读理解 · 仔细阅读";
        if (it.kind === "translation") return "翻译 · 汉译英";
        return "--";
      }

      function scoreOf(it) {
        var list = SCORE_ITEMS;
        for (var i = 0; i < list.length; i++) {
          var s = list[i];
          if (it.kind === "writing" && s.kind === "writing") return s;
          if (it.kind === "translation" && s.kind === "translation") return s;
          if (it.listenNo != null && s.listenNo === it.listenNo) return s;
          if (it.blankNo != null && s.blankNo === it.blankNo) return s;
          if (it.matchNo != null && s.matchNo === it.matchNo) return s;
          if (it.readingNo != null && s.readingNo === it.readingNo) return s;
        }
        return null;
      }

      function siblingsOf(it) {
        if (it.listenGroup) return ITEMS.filter(function (x) { return x.listenGroup === it.listenGroup; });
        if (it.kind === "cloze") return itemsOf("cloze");
        if (it.kind === "matching") return itemsOf("matching");
        if (it.kind === "careful") {
          var p2 = it.readingNo != null && it.readingNo >= 51;
          return ITEMS.filter(function (x) {
            return x.kind === "careful" && ((x.readingNo != null && x.readingNo >= 51) === p2);
          });
        }
        return [it];
      }

      function optionBlock(options) {
        if (!options) return "";
        return options.map(function (o) {
          return '<div class="q-opt">' + esc(o.key) + ". " + esc(o.text) + "</div>";
        }).join("");
      }

      function dirHtml(text) {
        return '<p class="dir"><span class="font-semibold text-[#333]">Directions: </span>' + esc(text) + "</p>";
      }

      function qFoot(it) {
        return '<div class="q-foot"><span>' + difficultyOf(it) +
          '<span class="q-foot-div">|</span>分值 ' + it.score + ' 分</span>' +
          '<button type="button" class="q-detail" data-detail="' + it.no + '">查看详情</button></div>';
      }

      function qWrap(it, inner) {
        return '<article id="q-' + it.no + '" class="q-block" data-q="' + it.no + '">' + inner + qFoot(it) + "</article>";
      }

      function clozePassage() {
        var byBlank = {};
        ITEMS.forEach(function (it) { if (it.blankNo != null) byBlank[it.blankNo] = it.no; });
        return CLOZE_SEGS.map(function (seg) {
          if (seg.type !== "blank") return esc(seg.text);
          var qNo = byBlank[seg.no] || seg.no;
          return '<span id="q-' + qNo + '" class="blank-no" data-q="' + qNo + '" data-blank="' + seg.no + '">' + seg.no + "</span>";
        }).join("");
      }

      function wordBank() {
        return '<div class="mt-5 grid grid-cols-3 gap-x-8 gap-y-2 text-[14px] leading-[1.8] text-[#333] sm:grid-cols-5">' +
          CLOZE_BANK.map(function (w) {
            return "<div>" + esc(w.key) + ") " + esc(w.word) + "</div>";
          }).join("") + "</div>";
      }

      function listenFileName(it) {
        var range = it.listenRange || [it.listenNo, it.listenNo];
        var mat = String(it.material || "Listening").replace(/\s+/g, "");
        return "CET4_Listening_" + mat + "_Q" + range[0] + "-" + range[1] + ".mp3";
      }

      function listenFileBtn(it) {
        var key = it.listenGroup || ("l-" + it.listenNo);
        var name = listenFileName(it);
        var src = it.audio || "";
        var dur = it.duration || 48;
        return '<button type="button" class="listen-file" data-audio="' + esc(key) +
          '" data-src="' + esc(src) + '" data-duration="' + dur + '" aria-label="播放 ' + esc(name) + '">' +
          '<svg class="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
          '<svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>' +
          '<span class="listen-file-tip">' + esc(name) + "</span></button>";
      }

      function renderPaper() {
        var html = "";
        var writing = itemsOf("writing")[0];
        var listening = itemsOf("listening");
        var cloze = itemsOf("cloze");
        var matching = itemsOf("matching");
        var careful = itemsOf("careful");
        var translation = itemsOf("translation")[0];

        html += '<h3 class="part-h">PART I  Writing</h3>';
        html += qWrap(writing, '<div class="q-stem">' + esc(writing.stem) + "</div>" +
          '<p class="mt-3 text-[15px] leading-[1.9] text-[#222]">' + esc(writing.material) + "</p>");

        html += '<h3 class="part-h">PART II  Listening Comprehension</h3>';
        var lastSec = "";
        var lastGroup = "";
        listening.forEach(function (it) {
          if (it.listenSection && it.listenSection !== lastSec) {
            html += '<h4 class="sec-h">Section ' + esc(it.listenSection) + "</h4>";
            html += dirHtml(String(it.directions || "").replace(/^Section [ABC]\.\s*Directions:\s*/i, ""));
            lastSec = it.listenSection;
          }
          var gk = it.listenGroup || "";
          if (gk !== lastGroup) {
            var range = it.listenRange;
            html += '<p class="mb-3 mt-5 flex items-start text-[14px] leading-[1.85] text-[#666]">' +
              listenFileBtn(it) +
              "<span>Questions " + (range ? range[0] + " to " + range[1] : displayNo(it)) +
              " are based on the recording you have just heard.</span></p>";
            lastGroup = gk;
          }
          var stem = String(it.stem || "").replace(/^Question\s+\d+\.\s*/i, "");
          html += qWrap(it, '<div class="q-stem"><span class="font-medium">' + displayNo(it) + ". </span>" + esc(stem) + "</div>" + optionBlock(it.options));
        });

        html += '<h3 class="part-h">PART III  Reading Comprehension</h3>';
        html += '<h4 class="sec-h">Section A</h4>';
        html += dirHtml("In this section, there is a passage with ten blanks. You are required to select one word for each blank from a list of choices given in a word bank following the passage. You may not use any of the words in the bank more than once.");
        html += '<p class="text-[15px] leading-[2.15] text-[#222]">' + clozePassage() + "</p>";
        html += wordBank();

        html += '<h4 class="sec-h">Section B</h4>';
        html += dirHtml("In this section, you are going to read a passage with ten statements attached to it. Each statement contains information given in one of the paragraphs. Identify the paragraph from which the information is derived. You may choose a paragraph more than once.");
        MATCH_PARAS.forEach(function (p) {
          html += '<p class="mb-3 text-[15px] leading-[1.95] text-[#222]"><span class="mr-1 font-bold">' + esc(p.key) + ".</span>" + esc(p.text) + "</p>";
        });
        matching.forEach(function (it) {
          html += qWrap(it, '<div class="q-stem"><span class="font-medium">' + displayNo(it) + ". </span>" + esc(it.stem) + "</div>");
        });

        html += '<h4 class="sec-h">Section C</h4>';
        html += '<p class="dir italic">Directions: There are 2 passages in this section. Each passage is followed by some questions or unfinished statements. For each of them there are four choices marked A), B), C) and D).</p>';
        var p1List = careful.filter(function (it) { return it.readingNo == null || it.readingNo < 51; });
        var p2List = careful.filter(function (it) { return it.readingNo != null && it.readingNo >= 51; });
        function renderCareful(title, passage, qList, rangeLabel) {
          html += '<h4 class="mb-2 mt-8 text-[15px] font-bold">' + esc(title) + "</h4>";
          html += '<p class="mb-4 text-[13px] italic leading-[1.85] text-[#666]">' + esc(rangeLabel) + "</p>";
          String(passage || "").split(/\n\n+/).forEach(function (para) {
            html += '<p class="mb-4 text-[15px] leading-[2] text-[#222]">' + esc(para) + "</p>";
          });
          qList.forEach(function (it) {
            html += qWrap(it, '<div class="q-stem"><span class="font-medium">' + displayNo(it) + ". </span>" + esc(it.stem) + "</div>" + optionBlock(it.options));
          });
        }
        renderCareful("Passage One", CAREFUL_P1, p1List, "Questions 46 to 50 are based on the following passage.");
        renderCareful("Passage Two", CAREFUL_P2, p2List, "Questions 51 to 55 are based on the following passage.");

        html += '<h3 class="part-h">PART IV  Translation</h3>';
        html += qWrap(translation, '<div class="q-stem">' + esc(translation.stem) + "</div>" +
          '<p class="mt-4 text-[15px] leading-[1.9] text-[#222]">' + esc(translation.source) + "</p>");

        document.getElementById("paperBody").innerHTML = html;
      }

      function renderNav() {
        document.getElementById("structNav").innerHTML = GROUPS.map(function (g) {
          var m = groupMeta(g.key);
          var list = itemsOf(g.key);
          return '<div class="mb-6">' +
            '<div class="mb-3 text-[13px] text-[#666]">' + esc(g.title) +
            " (共" + m.count + "题; 共" + m.score + "分)</div>" +
            '<div class="flex flex-wrap gap-2">' + list.map(function (it) {
              return '<button type="button" class="nav-num" data-jump="' + it.no + '">' + displayNo(it) + "</button>";
            }).join("") + "</div></div>";
        }).join("");
      }

      var activeNo = 1;

      function setActive(no) {
        activeNo = no;
        document.querySelectorAll(".nav-num").forEach(function (btn) {
          btn.classList.toggle("is-on", Number(btn.getAttribute("data-jump")) === no);
        });
        document.querySelectorAll(".q-block").forEach(function (el) {
          el.classList.toggle("is-on", Number(el.getAttribute("data-q")) === no);
        });
        document.querySelectorAll(".blank-no").forEach(function (el) {
          var it = findItem(no);
          el.classList.toggle("is-on", !!(it && it.blankNo && Number(el.getAttribute("data-blank")) === it.blankNo));
        });
      }

      function parentHtml(it) {
        if (it.kind === "listening") {
          var range = it.listenRange || [it.listenNo, it.listenNo];
          return '<div class="detail-h">母题</div>' +
            '<div class="parent-box px-4 py-3 text-[13px] leading-7 text-[#333]">' +
            '<div class="text-[12px] text-[#999]">Part II Listening · ' + esc(it.material || "") + "</div>" +
            '<p class="mt-1">' + esc(it.directions || "") + "</p>" +
            '<p class="mt-2 flex items-start text-[#666]">' + listenFileBtn(it) +
            "<span>Questions " + range[0] + " to " + range[1] + " are based on the recording you have just heard.</span></p></div>";
        }
        if (it.kind === "cloze") {
          var segs = CLOZE_SEGS.map(function (seg) {
            if (seg.type !== "blank") return esc(seg.text);
            var on = seg.no === it.blankNo;
            return '<span class="blank-no' + (on ? " is-on" : "") + '">' + seg.no + "</span>";
          }).join("");
          var bank = CLOZE_BANK.map(function (w) {
            return "<span class='mr-4 inline-block'>" + esc(w.key) + ") " + esc(w.word) + "</span>";
          }).join("");
          return '<div class="detail-h">母题</div>' +
            '<div class="parent-box px-4 py-3 text-[13px] leading-7 text-[#333]">' +
            '<p>' + esc(it.directions || "") + "</p>" +
            '<p class="mt-3 text-[14px] leading-[2]">' + segs + "</p>" +
            '<div class="mt-3 text-[13px]">' + bank + "</div></div>";
        }
        if (it.kind === "matching") {
          var paras = MATCH_PARAS.map(function (p) {
            return '<p class="mb-2"><span class="mr-1 font-bold">' + esc(p.key) + ".</span>" + esc(p.text) + "</p>";
          }).join("");
          return '<div class="detail-h">母题</div>' +
            '<div class="parent-box max-h-[220px] overflow-auto px-4 py-3 text-[13px] leading-7 text-[#333]">' +
            '<p class="mb-3">' + esc(it.directions || "") + "</p>" + paras + "</div>";
        }
        if (it.kind === "careful") {
          var passage = (it.readingNo != null && it.readingNo >= 51) ? CAREFUL_P2 : CAREFUL_P1;
          var title = it.passageTitle || ((it.readingNo != null && it.readingNo >= 51) ? "Passage Two" : "Passage One");
          var paras = String(passage).split(/\n\n+/).map(function (p) {
            return '<p class="mb-2 last:mb-0">' + esc(p) + "</p>";
          }).join("");
          return '<div class="detail-h">母题</div>' +
            '<div class="parent-box max-h-[220px] overflow-auto px-4 py-3 text-[13px] leading-7 text-[#333]">' +
            '<div class="mb-1 font-medium">' + esc(title) + "</div>" + paras + "</div>";
        }
        return "";
      }

      function childBody(it) {
        var score = scoreOf(it);
        var html = "";
        if (it.kind === "writing") {
          html += '<div class="text-[14px] leading-7">' + esc(it.stem) + "</div>";
          html += '<div class="parent-box mt-2 px-3 py-3 text-[13px] leading-7">' + esc(it.material) + "</div>";
        } else if (it.kind === "translation") {
          html += '<div class="text-[14px] leading-7">' + esc(it.stem) + "</div>";
          html += '<div class="parent-box mt-2 px-3 py-3 text-[13px] leading-7">' + esc(it.source) + "</div>";
        } else if (it.kind === "matching") {
          html += '<div class="text-[14px] leading-7"><span class="font-medium">' + displayNo(it) + ". </span>" + esc(it.stem) + "</div>";
          html += '<p class="mt-2 text-[13px] text-[#888]">从段落 A–M 中选择信息来源。</p>';
        } else {
          var stem = String(it.stem || "").replace(/^Question\s+\d+\.\s*/i, "");
          html += '<div class="text-[14px] leading-7"><span class="font-medium">' + displayNo(it) + ". </span>" + esc(stem) + "</div>";
          html += '<div class="mt-2">' + optionBlock(it.options) + "</div>";
        }
        html += '<div class="detail-h">答案</div>';
        html += '<div class="text-[14px] leading-7 text-[#333]">' + esc((score && score.correct) || "--") + "</div>";
        html += '<div class="detail-h">解析</div>';
        html += '<div class="text-[14px] leading-7 text-[#333]">' + esc((score && score.analysis) || "演示解析。") + "</div>";
        html += '<div class="detail-h">知识点</div>';
        html += '<div class="text-[14px] leading-7 text-[#333]">' + esc(knowledgeOf(it)) + "</div>";
        return html;
      }

      function renderDetail(it) {
        var sibs = siblingsOf(it);
        var main = "";
        if (sibs.length > 1) {
          main += '<div class="mb-4 flex flex-wrap items-center gap-2 text-[12px] text-[#888]">' +
            '<span>本题组小题</span>' + sibs.map(function (sq) {
              var on = sq.no === it.no ? " is-on" : "";
              return '<button type="button" class="sub-pill' + on + '" data-sub="' + sq.no + '">' + displayNo(sq) + "</button>";
            }).join("") + "</div>";
        }
        main += parentHtml(it);
        main += '<div class="detail-h">题目</div>' + childBody(it);
        document.getElementById("detailMain").innerHTML = main;
        document.getElementById("detailSide").innerHTML =
          '<div class="text-[14px] font-medium text-[#222]">题目信息</div>' +
          '<div class="mt-5 text-[13px] text-[#999]">创建时间</div><div class="mt-1 text-[13px] text-[#333]">2026-08-21</div>' +
          '<div class="mt-4 text-[13px] text-[#999]">题型</div><div class="mt-1 text-[13px] text-[#333]">' + esc(typeOf(it)) + "</div>" +
          '<div class="mt-4 text-[13px] text-[#999]">难度</div><div class="mt-1 text-[13px] text-[#333]">' + esc(difficultyOf(it)) + "</div>" +
          '<div class="mt-4 text-[13px] text-[#999]">出题人</div><div class="mt-1 text-[13px] text-[#333]">WPS 官方</div>';
      }

      function openDetail(no) {
        var it = findItem(no);
        setActive(no);
        renderDetail(it);
        var mask = document.getElementById("detailMask");
        mask.classList.remove("hidden");
        mask.classList.add("flex");
      }

      function closeDetail() {
        var mask = document.getElementById("detailMask");
        mask.classList.add("hidden");
        mask.classList.remove("flex");
      }

      function yInScroller(el, scroller) {
        return el.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop;
      }

      function jumpTo(no) {
        var el = document.getElementById("q-" + no);
        var scroller = document.getElementById("paperScroll");
        if (!el || !scroller) return;
        setActive(no);
        scroller.scrollTo({ top: yInScroller(el, scroller) - 24, behavior: "smooth" });
      }

      function syncActiveByScroll() {
        var scroller = document.getElementById("paperScroll");
        var y = scroller.scrollTop + 80;
        var current = ITEMS[0].no;
        ITEMS.forEach(function (it) {
          var el = document.getElementById("q-" + it.no);
          if (el && yInScroller(el, scroller) <= y) current = it.no;
        });
        if (current !== activeNo) setActive(current);
      }

      var listenAudio = {};
      var listenFake = {};

      function stopListen(key) {
        var a = listenAudio[key];
        if (a) { a.pause(); a.currentTime = 0; }
        if (listenFake[key]) {
          clearInterval(listenFake[key]);
          listenFake[key] = null;
        }
        document.querySelectorAll('.listen-file[data-audio="' + key + '"]').forEach(function (btn) {
          btn.classList.remove("is-on");
        });
      }

      function stopAllListen(except) {
        Object.keys(listenAudio).forEach(function (k) {
          if (k !== except) stopListen(k);
        });
        document.querySelectorAll(".listen-file.is-on").forEach(function (btn) {
          var k = btn.getAttribute("data-audio");
          if (k !== except) stopListen(k);
        });
      }

      function startFakePlay(key, duration, btn) {
        var t = 0;
        if (listenFake[key]) clearInterval(listenFake[key]);
        listenFake[key] = setInterval(function () {
          if (!btn.classList.contains("is-on")) {
            clearInterval(listenFake[key]);
            listenFake[key] = null;
            return;
          }
          t += 250;
          if (t >= duration * 1000) stopListen(key);
        }, 250);
      }

      function toggleListen(btn) {
        var key = btn.getAttribute("data-audio");
        var src = btn.getAttribute("data-src");
        var duration = Number(btn.getAttribute("data-duration")) || 48;
        if (btn.classList.contains("is-on")) {
          stopListen(key);
          return;
        }
        stopAllListen(key);
        if (!listenAudio[key] && src) {
          var a = new Audio(src);
          a.preload = "none";
          a.addEventListener("ended", function () { stopListen(key); });
          a.addEventListener("error", function () {
            if (btn.classList.contains("is-on") && !listenFake[key]) startFakePlay(key, duration, btn);
          });
          listenAudio[key] = a;
        }
        document.querySelectorAll('.listen-file[data-audio="' + key + '"]').forEach(function (el) {
          el.classList.add("is-on");
        });
        var audio = listenAudio[key];
        if (!audio) {
          startFakePlay(key, duration, btn);
          return;
        }
        var playPromise = audio.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () { startFakePlay(key, duration, btn); });
        }
      }

      renderPaper();
      renderNav();
      setActive(1);

      document.getElementById("structNav").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-jump]");
        if (!btn) return;
        jumpTo(Number(btn.getAttribute("data-jump")));
      });
      document.getElementById("paperScroll").addEventListener("scroll", syncActiveByScroll);
      document.getElementById("paperScroll").addEventListener("click", function (e) {
        var playBtn = e.target.closest("[data-audio]");
        if (playBtn) {
          e.preventDefault();
          e.stopPropagation();
          toggleListen(playBtn);
          return;
        }
        var detail = e.target.closest("[data-detail]");
        if (detail) {
          e.stopPropagation();
          openDetail(Number(detail.getAttribute("data-detail")));
          return;
        }
        var blank = e.target.closest("[data-blank]");
        if (blank) {
          openDetail(Number(blank.getAttribute("data-q")));
          return;
        }
        var block = e.target.closest(".q-block");
        if (block) setActive(Number(block.getAttribute("data-q")));
      });
      document.getElementById("closeDetail").onclick = closeDetail;
      document.getElementById("detailMask").addEventListener("click", function (e) {
        if (e.target === this) closeDetail();
      });
      document.getElementById("detailMain").addEventListener("click", function (e) {
        var playBtn = e.target.closest("[data-audio]");
        if (playBtn) {
          e.preventDefault();
          toggleListen(playBtn);
          return;
        }
        var pill = e.target.closest("[data-sub]");
        if (!pill) return;
        openDetail(Number(pill.getAttribute("data-sub")));
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeDetail();
      });
    })();
  </script>
</body>
</html>
